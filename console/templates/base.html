<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fleet{% endblock %} — fleet console</title>
<style>
:root {
  --bg:#fbfbfa; --fg:#1a1a18; --dim:#6b6b66; --line:#e0e0dc; --panel:#fff;
  --ok:#0f7b3e; --warn:#9a6700; --bad:#a4243b; --accent:#1f4e79;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#16171a; --fg:#e6e6e3; --dim:#9a9a94; --line:#2c2e33; --panel:#1c1e22;
          --ok:#4ec27f; --warn:#d3a24a; --bad:#e2778b; --accent:#7fb0e0; }
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif }
header { border-bottom:1px solid var(--line); padding:.6rem 1rem;
  display:flex; gap:1.2rem; align-items:baseline; flex-wrap:wrap }
header a { color:var(--fg); text-decoration:none; padding:.15rem 0 }
header a.on { border-bottom:2px solid var(--accent) }
header .who { margin-left:auto; color:var(--dim); font-size:12px;
  font-family:ui-monospace,monospace }
main { padding:1rem; max-width:1400px }
h1 { font-size:1.15rem; margin:.2rem 0 .9rem }
h2 { font-size:.95rem; margin:1.6rem 0 .5rem; color:var(--dim);
  text-transform:uppercase; letter-spacing:.06em }
table { border-collapse:collapse; width:100%; font-size:13px }
th,td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--line);
  vertical-align:top }
th { color:var(--dim); font-weight:600; white-space:nowrap }
tr:hover td { background:var(--panel) }
code,pre,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px }
pre { background:var(--panel); border:1px solid var(--line); border-radius:5px;
  padding:.6rem; overflow-x:auto }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:.7rem .9rem; margin:.5rem 0 }
.pill { display:inline-block; padding:.05rem .45rem; border-radius:10px;
  border:1px solid var(--line); font-size:11.5px; white-space:nowrap }
.ok{color:var(--ok);border-color:var(--ok)} .warn{color:var(--warn);border-color:var(--warn)}
.bad{color:var(--bad);border-color:var(--bad)} .dim{color:var(--dim)}
.big { font-size:1.7rem; font-weight:600; line-height:1.1 }
.filters a { margin-right:.7rem; color:var(--accent); text-decoration:none; font-size:13px }
.filters a.on { font-weight:700; text-decoration:underline }
.grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)) }
.note { border-left:3px solid var(--warn); padding:.5rem .8rem; background:var(--panel);
  margin:.6rem 0; border-radius:0 5px 5px 0 }
.empty { color:var(--dim); padding:.8rem 0 }
a.t { color:var(--accent); text-decoration:none } a.t:hover { text-decoration:underline }
.diff { overflow-x:auto; font-size:12px; line-height:1.35 }
{{ diff_css|safe }}
</style>
</head>
<body>
<header>
  <strong>fleet</strong>
  <a href="/tasks" class="{% block nav_tasks %}{% endblock %}">Tasks</a>
  <a href="/detectors" class="{% block nav_det %}{% endblock %}">Detectors</a>
  <a href="/proposals" class="{% block nav_prop %}{% endblock %}">Proposals</a>
  <span class="who">read-only as {{ running_as }}</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
