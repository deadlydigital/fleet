# The backend contract. Narrower than it looks, and it says why.
#
# WHAT THIS CAN ESTABLISH
#   the changed files still parse
#   the changed files are clean under the project's own ruff.toml
#
#   tests/unit passes, file by file           (31 files, 226s)
#   tests/analytics passes, file by file      (34 files, 675 tests, 713s)
#   the ONE test the change added fails without the change
#
# WHAT IT CANNOT
#   that anything still works beyond tests/unit and tests/analytics. tests/api
#   (~10 min) and tests/integration are green as of 8 Sep 2026 and are still
#   not gated here -- time, not redness.
#
#   that the added test asserts the RIGHT thing. new_test_bites.sh proves the
#   test discriminates between the tree before the change and the tree after
#   it. Whether it discriminates on the property the spec asked for is a
#   question only a reader can answer, and auto-merge does not answer it.
#
# THE 81 FAILURES WERE FICTION (corrected 8 Sep 2026)
#
# This contract had no test gate because TEST-004 recorded "roughly 81
# pre-existing failures". Re-measured file by file on a clean database: 26,
# and not one of them a defect in production code. Three of the four rows in
# that baseline were dated 17 August and marked "not re-measured" -- already
# three weeks stale when filed, and the unit and api fixes landed a week
# later. The corrected table is in docs/TODO.md under TEST-004.
#
# What the 26 actually were: a Redis client hard-coded to 6379 when the test
# container publishes 6380 (11, and they never failed in CI); a container name
# that had never existed (3); campaign-id fixtures shorter than the id floor
# 460306e introduced (2); a contract fixture whose tenant had no subscription
# (7); a key-extractor that required keys from endpoints it deliberately
# refused to call (1); and a tenant sequence never advanced past the static
# ids (3).
#
# WHY tests/analytics IS IN, AS OF 9 Sep 2026
#
# It was excluded because it exhausted the test database's 384 MiB tmpfs after
# about eight files. That went away on 8 Sep when the tmpfs was raised to
# 1536 MiB, leaving only time -- and re-measured per file at 9df8821 on 9 Sep
# it is 34 files, 675 tests, 713 seconds, all green.
#
# tests/api stays out: ~10 minutes, and it is the suite least likely to say
# anything about an analytics report. The changed-file-aware gate that would
# make cost proportional to the diff is still the right answer and is still
# proposed separately.
#
# WHY LINT IS AIMED AT THE CHANGED FILES
#
# `ruff check api/` reports 402 errors on a clean checkout of main. 261 of
# them are inside api/tests/ and api/alembic/, which are protected paths, and
# 65 more are in files no contract declares writable. An agent could fix 65
# of 402, so a repo-wide gate fails every task for a mess the task could not
# touch, and would keep failing after a perfect run.
#
# So lint is aimed at the change: ruff runs under the project's own
# unmodified ruff.toml, and the gate is that the change introduces no finding
# that was not already there. A ratchet rather than a clean-file rule,
# because the files worth changing are often already dirty --
# api/analytics/routes/revenue.py carries a pre-existing I001, so a one-line
# docstring fix there would fail a must-be-clean gate for history it did not
# create. Worse, satisfying such a gate means every task arrives carrying an
# unrelated import-sort, which is exactly the widening
# specs/revenue-granularity-doc.md tells the agent not to do. A gate that
# contradicts the spec it enforces gets satisfied by widening the diff.
#
# No rule is disabled and no threshold is lowered. The backlog is a separate
# tracked job; see docs/TODO.md in the platform repository.
#
# `{changed_files:.py}` expands to the paths the RUNNER derived from git,
# never the agent's account of what it changed. If no .py file changed, the
# check is recorded as skipped rather than passed, and a run in which every
# check skipped does not pass at all.

work_type: dd_api
repo: deadly-digital-platform
base_branch: main
contract_version: 2

# WRITABLE PATHS ARE ENUMERATED, NOT GLOBBED, AND THAT IS DELIBERATE.
#
# 017 put the email surface on protected_path_floor, and the floor is checked
# against writable_paths as well as against protected_paths. `api/analytics/
# services/**` writable and `api/analytics/services/trigger_router.py` floored
# is a contradiction the database refuses, correctly -- so the glob has to go.
#
# Enumerating is the price of the floor and it buys something: this list IS the
# statement of what an unattended fleet may write, in one place, with no
# wildcard hiding a file nobody thought about. See
# specs/unattended-operation.md §2.
#
# api/app.py is gone. 19,300 lines, 180 endpoints, 39 of them email -- flows,
# campaigns, deliverability, suppression. Analytics work has never needed it:
# tasks 26 and 28 both wrote only under api/analytics/.
#
# api/services/** is gone. It holds email_sender.py AND template_renderer.py,
# which renders email templates and injects open-tracking pixels. Parity work
# on analytics does not reach into it, and a task that genuinely needs it is
# one a person queues with a widened contract.
#
# gdpr.py went on the floor in 018, after 017 deliberately left it: erasure is
# the one change here that reverting the commit does not undo.
#
# NOT excluded, and worth a decision rather than a default:
#   api/analytics/services/intervention_tracker.py   marks interventions converted
