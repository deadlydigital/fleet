# ONE new test may be ADDED, and no existing test may be touched.
#
# api/tests/** is floored as "the suite that judges the work", and that
# argument is about MODIFICATION -- an agent that edits an existing test can
# make it pass. Adding a file cannot weaken a test that already exists.
#
# Without this an agent cannot write tests at all, so a feature lands with
# nothing covering the new behaviour and a green suite means "broke nothing"
# while reading as "verified". specs/unattended-operation.md §3.2.
#
# 020 refuses any creatable glob not already inside a protected one, so this
# can only ever narrow protected_paths and never widen writable_paths. What
# stops the added test being vacuous is new_test_bites.sh below, not this --
# the two are a pair.
creatable_paths:
  - api/tests/analytics/test_fleet_*.py

# api/.venv is gitignored and absent from a worktree, so the interpreter and
# ruff are named by absolute path. They are read, never written.
verification:
  # FIRST, AND CHEAPEST. A git diff and a regex, well under a second.
  #
  # specs/auto-approval.md §9.12, built 10 Sep 2026. Every other check here is
  # a fact about the tree and none of them reads the spec: task 53 shipped its
  # §2.5 unbuilt with all of them green. `auto_merge: false` caught that and is
  # gone, and `draft_spec` came off console/automerge's NEVER_UNATTENDED the
  # same day, so nothing reads a spec at any point now.
  #
  # It proves a claim was MADE, not that it was MET -- an agent can write
  # `// spec:2.5` and change nothing. That is still worth the annotation cost,
  # because it turns a silent omission into a written, attributable one sitting
  # in the diff. Run against task 53's real spec and real diff it reports 8 of
  # 8 requirements cited nowhere.
  #
  # Ordered first on this file's own argument, three paragraphs up: task 55
  # spent 107 seconds of tsc and vitest to be failed by the last line for a
  # reason the last line could have given in under a second.
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/spec_requirements_cited.py
  - /home/ubuntu/deadly-digital-platform/api/.venv/bin/python -m compileall -q {changed_files:.py}
  - /home/ubuntu/deadly-digital-platform/api/.venv/bin/python /home/ubuntu/fleet/contracts/checks/ruff_no_new_findings.py
  # ONE FILE PER PYTEST PROCESS. api/CLAUDE.md forbids suite and directory runs
  # on this host -- it serves production traffic, and incident 3 was an
  # allocation failure inside a test process with 63 MB free beside a live API.
  # The check starts the test services if they are down and stops them again if
  # it started them, aborts rather than compete for memory, and reports "could
  # not run" (2) rather than a pass when the database is unreachable.
  # ~4 minutes for 31 files, inside timeout_seconds below.
  - /home/ubuntu/fleet/contracts/checks/pytest_unit_per_file.sh api tests/unit
  # THE ADDED TEST MUST FAIL AGAINST THE TREE BEFORE THE CHANGE. Cheap enough
  # to sit ahead of the suites (two runs of one file), and it is the check that
  # makes creatable_paths safe rather than a hole. 6.2 Rule 2, by machine.
  - /home/ubuntu/fleet/contracts/checks/new_test_bites.sh api
  # tests/analytics: 34 files, 675 tests, 713s measured per-file at 9df8821 on
  # 9 Sep 2026 -- GREEN. The tmpfs blocker that kept it out went away on 8 Sep
  # when the test database moved from 384 MiB to 1536 MiB; what remained was
  # time, and timeout_seconds went to 3600 to buy it.
  #
  # It is what proves the change broke nothing. It is NOT what proves the
  # change works -- that is new_test_bites.sh above, and the distinction is the
  # whole of specs/unattended-operation.md §3.2.
  - /home/ubuntu/fleet/contracts/checks/pytest_unit_per_file.sh api tests/analytics

# ELIGIBLE FOR UNATTENDED MERGE, AND THIS IS SCOPED TO THE PARITY PUSH.
#
# A task under this contract merges without anybody looking, provided every
# gate above passed AND the test it added fails without the change. A spec that
# wants a person to see it sets `auto_merge: false` in its fleet-spec block.
#
# THE DEFAULT IS THE WAY ROUND IT IS BECAUSE OF WHEN THIS WAS WRITTEN, NOT
# BECAUSE UNATTENDED MERGING IS SAFE IN GENERAL. Deadly Digital has no
# customers, HIB is not using it, the parity rows are already agreed, and a bad
# spec costs a revert. Reading every spec would put a person back in the loop
# twice per feature, which is the thing the posture exists to remove.
#
# REVERSE THIS ONCE THERE ARE CUSTOMERS. specs/unattended-operation.md §7 lists
# it with the rest of what goes back. `true` here is a statement about this
# body of work on this product at this moment; it is not a design.
#
# WHAT IT COSTS, MEASURED ON 10 SEP 2026 AND WRITTEN DOWN SO IT IS A KNOWN
# TRADE RATHER THAN A DISCOVERY
# ---------------------------------------------------------------------------
# Task 53 shipped §2.5 of its own spec unbuilt -- the order table's Payment,
# Country and Coupon cells were to set the corresponding filter, and the diff
# does not touch row rendering at all. Every gate above's frontend equivalent
# passed: the tree typechecked, 319 tests passed, the added test bit, and both
# halves of the paired group landed.
#
# NONE OF THOSE CAN FAIL FOR A MISSING REQUIREMENT, and adding a fifth would
# not change that. tsc proves it compiles. The suite proves nothing broke.
# new_test_bites.sh proves the ONE test the change added fails without the
# change -- which says nothing about the requirements the change added no test
# for. pytest_unit_per_file.sh is the same shape one language over.
#
# That task was caught because dd-analytics-frontend.yaml sets
# `auto_merge: false`, so a person read the spec against the diff. **On THIS
# contract nobody does.** A dd_api task that implements four of five numbered
# requirements merges, deploys, and is recorded as MERGED with every check
# green. Nothing in the path would say otherwise, and the first evidence would
# be somebody using the feature.
#
# That is the trade being made here, stated plainly: unattended merge on this
# contract buys back a human reading per feature, and pays for it by removing
# the only reader of the spec. It is defensible while the product has no users
# and a revert is cheap.
#
# AND IT IS A SECOND, SEPARATE REASON TO REVERSE THIS -- not a restatement of
# the first one.
#
# The argument written above for reversing at customers is about the COST OF
# FAILURE: a bad merge is cheap now and expensive later. This is not that. A
# partially-built feature IS NOT A BAD MERGE. Every check is green, the diff
# is correct as far as it goes, nothing is broken, and no revert is triggered
# by it -- there is nothing for a revert to undo. It does not appear in
# `decision_outcomes`, it does not fail a gate, and it does not show up in the
# morning brief. The only way it surfaces is somebody using the feature and
# finding a piece of it absent.
#
# So reversing this default at customers is ALSO about restoring a reader, and
# that half of the argument does not get cheaper or more expensive with the
# number of users -- it is missing today, on a product with none. The cost-of-
# failure half says "not yet". The reader half says "this is already the
# situation, and it is only tolerable because nobody is looking at the
# product either".
#
# Which is why the frontend contract's `auto_merge: false` caught task 53 and
# nothing here would have. specs/auto-approval.md §9.9 records that instance,
# §9.12 costs the cheapest partial reader that would narrow it, and the
# console's review page now renders the spec's numbered requirements as a
# checklist beside the diff -- which helps a person reading, and reaches this
# contract not at all, because on this path nobody opens that page.
auto_merge: true

# THE SPEC MAY NOT NUMBER MORE REQUIREMENTS THAN THIS.
#
# A ceiling like max_diff_lines, checked at queue time BEFORE the money, and
# added 11 Sep 2026 after task 62 failed twice for the same reason in two
# different disguises: first £3.00 at the spend cap with no branch, then £5.02
# with 494 lines against a 400-line limit. Its spec numbers 25 requirements,
# and contracts/checks/spec_requirements_cited.py obliges the diff to cite
# every leaf of them.
#
# MEASURED, from the specs that actually merged under each work_type:
#
#     dd_api        4, 5, 5, 5      max 5
#     dd_frontend   8               max 8
#     research      17, 23          max 23   -- and deliberately NOT capped
#
# Research is uncapped because it produces a DOCUMENT: it has no diff limit to
# blow and its two merged specs numbered 17 and 23 without trouble. The failure
# this refuses is a code task's budget, and a document has none.
#
# 10: measured: the largest dd_api spec that merged numbers 5, doubled for headroom.
max_requirements: 10

# 400, UNCHANGED IN VALUE and changed in meaning: it counts PRODUCTION lines
# only now. The test this contract mandates is budgeted separately below.
#
# 400 WAS NEVER MEASURED. It was written into this file new in cc102f2 on
# 30 Aug, in the same commit as max_cost_gbp: 3.00. At that moment exactly one
# run in the system's history had produced a diff: three lines of dd_docs.
# There were no dd_api observations at all. The commit message discusses
# verification scoping at length and does not mention the diff limit. Compare
# max_requirements: 10 above, which records its derivation and has never
# refused anything.
#
# The four dd_api tasks that MERGED, production lines, which is the sample:
#
#   task 2    42      task 7    249
#   task 26  137      task 28   267
#
# RAISING IT TO 500 WAS PROPOSED AND REFUSED, 11 Sep 2026. The derivation was
# sound enough -- largest merged doubled is 534, the rule max_requirements
# states above, and mean+3sd of the four is 489 -- and it was refused anyway,
# because the split is what admits the two tasks that were refused on size and
# the extra 100 was not. Their production halves are 300 and 272, inside this
# 400 already. A number raised past every observation, on the strength of no
# observation, is the exact failure principles.md names: a ceiling set without
# measurement is found wrong by the work, not by review. So this one stays put
# and the work gets to find it. If a task with a reviewable production diff is
# refused here, THAT is the measurement, and it costs one run to get.
max_diff_lines: 400

# 300: THE FIGURE THE AGENT IS TOLD, and the only one of this pair that is
# meant to shape the test. It is guidance and the prompt says so in those
# words -- going a little over it is better than cutting a case that earns its
# place. It is not a gate, nothing refuses against it, and an agent that
# exceeds it has done nothing wrong.
#
# 300 because that is the figure two runs were working to when they produced
# tests that passed every check: task 67's 298 (MERGED) and task 69 attempt 3's
# 439, which was green on all six checks including new_test_bites.sh. The same
# target produced 377 and 439 on two runs of the same task, which is the range
# a target has, and is exactly why it cannot also be the bound.
test_diff_target: 300

# 1200: A RUNAWAY BOUND. Its job is to stop a pathological run, not to judge a
# test, and it is set an order of magnitude clear of anything plausible so
# that it never does the second by accident. The agent is never told it.
#
# WHAT IT IS NOT FOR, AND THE FOUR DAYS THAT ESTABLISHED IT. This number spent
# 11-12 Sep as a judgement: 300, then 600, then 400, each derived and each
# found wrong by the work. The full record is below and stays there. The short
# version is that a line count cannot tell a thorough test from a bloated one
# -- task 69's went from 20 cases to 30 with lines-per-case flat at 18.9 to
# 20.2, so length tracked the budget and told you nothing about the test --
# and three other gates already do the job it was pretending to:
#
#   new_test_bites.sh   runs the added test against the tree BEFORE the change
#                       and refuses if it passes there. A property of the test,
#                       not a proxy for one.
#   creatable_paths     one added file, matching one glob, never a modification.
#   max_diff_lines      production scope creep, which is the thing actually
#                       worth catching. Unchanged at 400 and still a real gate.
#
# Against those three, a line ceiling on the test has caught nothing but its
# own number. Every refusal it has ever issued was the agent meeting a figure
# it had been handed:
#
#   run 41   377 of 300   never executed
#   run 43   606 of 600   never executed
#   run 44   439 of 400   ALL SIX CHECKS PASSED, including new_test_bites.sh,
#                         and the branch was refused for 39 lines
#
# Run 44 is the whole argument. A verified, biting, ruff-clean branch whose
# production half was 345 of 400, refused by the one gate in the list that
# cannot see whether the test is any good. £11.73 across the three, and the
# feature is still not built.
#
# So the field stays, the split stays -- boundary.derive only separates the
# test from the change when this is set, and dropping it would put the test
# back in competition with max_diff_lines, which is the 11 Sep defect -- and
# the refusal moves out to where it can only fire on something pathological.
# If this ever refuses anything again, read the diff before raising it: at
# 1200 the interesting question is not the ceiling, it is what the agent did.
#
# ---------------------------------------------------------------------------
# HOW THIS NUMBER WAS ARRIVED AT, KEPT IN FULL. It was 300, raised to 600,
# lowered to 400, and each of those was a derivation that the next run refuted.
# The record is the point: the refutations are the most useful thing this field
# has ever produced and deleting the wrong versions would hide them.
#
# WHAT THE RAISE PREDICTED, AND WHAT HAPPENED
#
# The raise said: the tests are long because the work needs them to be, 298 of
# 300 is a censored observation rather than a snug fit, and at 600 tests will
# land somewhere below it and finally show their natural size. Task 69 was
# requeued with 600 to test exactly that. It is a clean comparison -- same
# task, same spec, same base commit, no prior-attempt feedback anywhere in
# build_prompt, the only difference being the two numbers in the size note:
#
#   told 300 (attempt 1)    377 lines, 20 cases    126% of budget, REFUSED
#   told 600 (attempt 2)    606 lines, 30 cases    101% of budget, REFUSED
#
# The test did not land below 600. It landed ON it, the way task 67 landed on
# 300 at 298. THE NUMBER IS AN ANCHOR THE OUTPUT FILLS, and the raise was an
# argument that a bigger anchor would reveal something. It revealed the anchor.
#
# AND "THOROUGH, NOT PADDED" SURVIVES AND STOPS MEANING WHAT IT MEANT. The
# extra 229 lines are 10 more test cases, not bulk: 20.2 lines per case against
# attempt 1's 18.9. That was the discriminator the raise leaned on, and it
# cannot tell "the test this change needs" from "as much test as the budget
# allows", because for a reconciliation feature there is always another case
# worth writing. Thoroughness here is elastic, so no observation of the agent
# can locate a ceiling -- the agent will meet whichever one it is given.
#
# 400: the largest test produced under maximum PRESSURE, rounded up. Attempt 1
# was told 300, tried to fit it, and could not get below 377 -- that is the
# closest thing in this dataset to the size the work actually demands, because
# it is the only figure produced by an agent trying to make it smaller. 400
# clears it by 23 lines. Nothing here supports 600: there is no evidence the
# 30-case version is better than the 20-case one, because NEITHER HAS EVER BEEN
# EXECUTED (see below), and a generosity argument with no evidence that the
# generosity buys anything is just a larger diff to review.
#
# WHAT THIS COST, PLAINLY, BECAUSE THE NEXT PERSON TEMPTED TO RE-MEASURE A
# CEILING SHOULD SEE IT BEFORE THEY START.
#
# A full day. 11 Sep evening through 12 Sep midday. Task 69 -- "reconcile each
# order's header total against the sum of its line items, and report the
# residual" -- was queued on 11 Sep and IS STILL NOT BUILT. What it has
# produced, in total:
#
#   run 41   £3.56   377 test lines of 300     refused, never executed
#   run 43   £4.41   606 test lines of 600     refused, never executed
#            -----
#            £7.97   two line counts. No code. No verification. No branch
#                    anybody can merge, and the feature the spec describes is
#                    exactly as absent as it was before either run started.
#
# Add the human time: an evening deriving 300 from six samples, a morning
# deriving 600 from the wrong reading of two of them, and an afternoon
# establishing that the second derivation was refuted by the run that tested
# it. Three ceilings, one feature, nothing shipped.
#
# THE CEILING WAS THE MEASUREMENT. Every number in that table is the agent
# meeting a figure it was handed, so each run measured the ceiling and not the
# work. A day went into calibrating a bound against an instrument that reports
# the bound back. That is the thing to notice before spending another run on
# it: if the quantity you are measuring moves when you change the limit, you
# are not measuring the quantity.
#
# WHAT WAS BUILT INSTEAD OF A THIRD NUMBER, 12 Sep 2026, both in the tree:
#
#   Boundary.size_only + runner/cycle.tick -- a size-only violation now RUNS
#   the verification and refuses afterwards. Nothing about the refusal changes;
#   the checks are collected before the run dies. Had this existed on 11 Sep,
#   run 41 would have said whether the 377-line test passes and whether it
#   bites, for the price of one pytest pass, and neither ceiling would have
#   been argued in the dark.
#
#   test_diff_target -- the stated figure and the enforced one stop being the
#   same number. An elastic producer told N lands near N, so N == the gate made
#   near-misses into dead runs structurally: 126% at 300, 101% at 600, 146% at
#   300 again. It began as agent.TEST_TARGET_FRACTION, 75% of the ceiling, and
#   became a field of its own the moment the ceiling stopped being calibrated:
#   a fraction of a runaway bound is a fraction of a number chosen not to bind.
#   The fraction survives only as the fallback for rows frozen before 12 Sep --
#   task 69's own row is one, which is why it is not hypothetical.
#
# ---------------------------------------------------------------------------
# THE SUPERSEDED ARGUMENT FOR 600, kept because its first half still stands.
#
# WHY 300 WAS WRONG, AND IT IS NOT THAT THE SAMPLE WAS SMALL. Every sample it
# rested on was measured under a regime that RATIONED the test: before 11 Sep
# 20:13 the test came out of max_diff_lines, so its length was chosen against
# the production code's need for room. Deriving the new, uncontested allowance
# from tests written under the contest carries the contest forward. That is the
# committed_gbp censoring argument f5c06f6 makes for money, applied to lines,
# and it was not applied here at the time.
#
# The size of the effect is measured, not argued. Task 67 wrote the same test
# for the same feature twice, on either side of the split:
#
#   run 38, shared budget      187 lines,  7 cases   refused on size
#   run 39, its own budget     298 lines, 18 cases   MERGED
#
# The old note also under-counted its own sample: it says "every added test
# measured to date" and lists four, and there were six -- task 49 (175) and
# task 55 (177), both dd_frontend, both mandated, are missing. With all six its
# own method gives mean 173, sd 29, mean+3sd 261, so 300 was generous against
# the censored spread and still too small for the first real test that met it.
#
# EVERY OBSERVATION, re-derived 12 Sep 2026 from the base and patch shas each
# run recorded, through boundary.derive's own predicate (ADDED, matching a
# creatable glob, added PLUS deleted):
#
#   SHARED BUDGET -- the test competed with the change. All lower bounds.
#     task 58   115    3 cases   dd_api        failed on ruff
#     task 49   175    3 cases   dd_frontend   failed on paired paths
#     task 55   177    5 cases   dd_frontend   failed on paired paths
#     task 67   187    7 cases   dd_api        refused on size (run 38)
#     task 53   190    6 cases   dd_frontend   MERGED
#     task 62   194    9 cases   dd_api        refused on size
#
#   OWN BUDGET -- the only regime this number governs, and all of it. The
#   budget each was TOLD is in brackets, because it turns out to be the
#   variable that predicts the number beside it.
#     task 67   298   18 cases   (300)   99%   dd_api  MERGED (run 39)
#     task 69   377   20 cases   (300)  126%   dd_api  REFUSED (run 41), at
#                                              218 of 400 production
#     task 69   606   30 cases   (600)  101%   dd_api  REFUSED (run 43), at
#                                              318 of 400 production
#     task 69   439   23 cases   (300)  146%   dd_api  REFUSED (run 44), at
#                                              345 of 400 production -- and
#                                              VERIFIED: all six checks green
#
# THE FIRST THREE WERE NEVER EXECUTED, AND THAT WAS THE DEFECT. The boundary is
# checked before verification, so runs 41 and 43 record `verification_skipped:
# boundary violation` and their checks never opened: no pytest, no ruff, no
# new_test_bites.sh. Every figure they produced is SIZE and SHAPE. Nothing said
# those tests passed and nothing said they BIT -- and a test that does not bite
# is precisely what a test allowance must not be calibrated on. Two runs, £7.97,
# and the only artefact either produced is a line count.
#
# Boundary.size_only fixed the ordering, and run 44 is what it bought. Same
# refusal, and this time the checks ran first:
#
#   spec_requirements_cited.py                    ok
#   compileall                                    ok
#   ruff_no_new_findings.py                       ok
#   pytest_unit_per_file.sh api tests/unit        ok
#   new_test_bites.sh api                         ok   <- THE TEST BITES
#   pytest_unit_per_file.sh api tests/analytics   ok
#
# A green, biting, ruff-clean branch with 345 of 400 production lines, refused
# for 39 lines of test. That is the evidence the first two runs destroyed, and
# it is what demoted this field from a judgement to a runaway bound: the one
# time the gate was asked to justify itself against a test somebody had
# actually checked, the test was fine.
#
# Per-TEST, not per-suite -- new_test_bites.sh refuses a change that adds more
# than one test file.
max_test_diff_lines: 1200
# 6.00, measured 11 Sep 2026, was 3.00. PROVISIONAL: it rests on three
# observations, and should be replaced by measurement rather than by argument.
#
# The £3.00 ceiling stopped 4 of 13 code tasks, and nothing has ever completed
# between £2.50 and £3.00 -- that gap is the cap truncating the distribution,
# not an absence of work costing it. committed_gbp cannot show this on its own:
# reserve_model_budget() commits the whole reservation and settle_model_budget()
# refunds the difference, so a row sitting exactly on its cap means actual >=
# cap, not actual == cap. Five rows on this host are lower bounds for that
# reason.
#
# The only code runs ever allowed past £3.00, and the whole basis of 6.00:
#
#   task 7,  run 9   ~£5.50   249 diff lines, verification PASS, MERGED -- a
#                             correctly scoped code task that shipped. It is
#                             RECORDED as £3.00: it ran 31 Aug, before 4b11636
#                             wired --max-budget-usd, so nothing stopped it and
#                             settlement clipped the record. Five fits of its
#                             tokens give £4.95-£5.87, and those fits
#                             under-predict every run known to have been
#                             clipped, so £5.50 is a floor.
#   task 62, run 32   £5.02   494 diff lines, ran to completion, then refused
#                             by max_diff_lines. A cost observation, not a
#                             successful task.
#   task 67, run 38   £5.89   ADDED 11 Sep 2026, after this cap was raised:
#                             459 diff lines, ran to completion, then refused
#                             by max_diff_lines. The first UNCENSORED
#                             observation of a substantial dd_api task -- it
#                             settled below its ceiling rather than on it.
#                             It used 98% of the 6.00 granted here. That is
#                             thinner headroom than this comment assumed, and
#                             it is the strongest argument for re-measuring
#                             soon rather than eventually.
#
# 6.00 clears all three, but only just -- run 38 came within £0.11 of it. It
# still refuses: ~2.7x the median completed code task (£2.22), and above any
# code work yet observed.
#
# TO WHOEVER RE-MEASURES: the right tail above £3.00 has never been visible,
# because the cap removed it. Let several code tasks run at 6.00, then replace
# this comment with their spread. Three points is not a distribution, and two
# of the three were refused on size before they could be judged on merit.
max_cost_gbp: 6.00
# 3600, not 1800. timeout_seconds is ONE clock for the agent and for
# verification -- runner/cycle.py sets deadline = started + timeout_seconds and
# passes what remains to verify.run. Measured 9 Sep 2026: tests/unit 226s +
# tests/analytics 713s + mutation ~20s = ~960s of verification, which left an
# agent 840s. Task 7 took 820s. Twenty seconds is not margin, and the failure
# mode is the bad one: the agent does not fail for being slow, verification
# times out and is reported as a FAILING CHECK.
timeout_seconds: 3600
