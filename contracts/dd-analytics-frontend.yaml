# The analytics frontend, enumerated.
#
# Three parity features have shipped in the API and reach nobody: order
# filters (task 2), net revenue after refunds (task 26) and comparison
# windows (task 28) all exist behind /api/analytics and none of them is on a
# page. This is the contract under which a page changes.
#
# It replaces contracts/deadly-digital-platform.yaml, which is deleted rather
# than narrowed. That contract declared platform/app/**, platform/components/**
# and platform/lib/** writable, which reaches platform/lib/auth.ts, roles.ts,
# csrf.ts, app/api/auth/impersonate/route.ts, app/api/billing/checkout/route.ts
# and the campaign send route. A wide contract left standing beside a narrow one
# makes the narrow one a convention rather than a boundary -- anybody may queue
# a task under either -- and the wide one reached impersonation and billing.
#
# 023_platform_floor.sql is what makes that deletion a decision rather than a
# tidy-up: the paths above are on protected_path_floor now, so the retired
# contract cannot be reinstated by restoring the file.
#
# ============================================================================
# WHY THE WRITABLE PATHS ARE ENUMERATED
# ============================================================================
#
# Two reasons, and the first is not a choice.
#
# 023 floors the intervention surface -- platform/app/api/analytics/interventions,
# churn/intervene, and the page -- for the reason 017 floored
# api/analytics/routes/interventions.py: it sits INSIDE the tree the fleet owns
# and it is the door analytics grows into the email platform through. The floor
# is checked against writable_paths as well as protected_paths, so
# `platform/app/api/analytics/**` writable and one of its subdirectories floored
# is a contradiction the database refuses, correctly. The glob therefore has to
# go, exactly as `api/analytics/services/**` had to go from the api contract.
#
# The second is the api contract's own argument, which holds here: this list IS
# the statement of what an unattended fleet may write on the frontend, in one
# place, with no wildcard hiding a file nobody thought about.
#
# THE PRICE. A new report page in a directory not named below needs a line
# added here, by the person queueing the task. That is not friction to be
# engineered away -- it is the review this contract's narrowness is made of, and
# it is one line in a file a person already has open to queue the work.
#
# ============================================================================
# WHAT VERIFICATION CAN AND CANNOT ESTABLISH
# ============================================================================
#
# Measured on a worktree of main at 4619a76 on 9 Sep 2026, with node_modules
# linked in as `worktree_links` does it:
#
#   tsc --noEmit                 exits 0 in 29s   (COLD, in a fresh worktree;
#                                                  8s in the checkout is a warm
#                                                  tsconfig.tsbuildinfo and is
#                                                  not the number that applies)
#   vitest run                   21 files, 319 tests, 65s, all green
#   one file under vitest        3.2s
#
# No database and no docker: the suite mocks HTTP with MSW. That makes this
# cheaper than the api gate and able to gate a task the same way
# pytest_unit_per_file.sh does.
#
# TEN of the 21 files are analytics render tests, and that is what makes a
# frontend gate worth having here rather than a formality.
#
# WHAT CANNOT GATE, MEASURED RATHER THAN ASSUMED
#
#   `next lint` drops into "How would you like to configure ESLint?" and waits
#   on a TTY forever. There is no .eslintrc, no eslint dependency and no eslint
#   binary in node_modules. This is CI-001 in the platform's docs/TODO.md and
#   it is not something a contract can work around.
#
#   `playwright test` has baseURL http://localhost:3000, and on this box that
#   port is the deadly-digital-platform container -- production. Its specs
#   submit registration, request password resets and send team invites. It is
#   logged as CI-004 in the platform's docs/TODO.md. Nothing here runs it.
#
# ============================================================================
# WHAT THIS CONTRACT IS FOR, AND WHAT IT IS NOT
# ============================================================================
#
# A green run here establishes that the tree typechecks, that 319 tests still
# pass, that the ONE test the change added fails without the change, and that
# every parameter each analytics page sends is one its proxy forwards. It does
# not establish that the page says a true thing, and it does not establish that
# the spec was implemented -- task 53 shipped a requirement unbuilt through all
# four, and task 55 added three table columns no spec asked for through all
# four again.
#
# `auto_merge` was `false` for exactly that reason and is `true` since 10 Sep
# 2026. The paragraph beside it is what that costs; it is not a tidy-up and it
# should be read before this contract is relied on.

work_type: dd_frontend
repo: deadly-digital-platform
base_branch: main
# 5 since 10 Sep 2026, later the same day: both paired_paths groups are gone and
# contracts/checks/proxy_passthrough.py stands in their place. Bumped because
# this version both ALLOWS something 4 refused -- a page-only change to either
# analytics page -- and REFUSES something 4 allowed -- a page that sends a
# parameter its proxy drops while both files move together. `runs.contract_version`
# is what keeps a run attributable to the contract that actually held it: task
# 53 ran under 4 and was held to the orders pairing, task 55 was failed by it,
# and nothing from here is. Same argument rank.RANK_VERSION makes.
contract_version: 6

# ---------------------------------------------------------------------------
# WRITABLE
#
# The analytics proxies, minus the two the floor takes. Directory globs rather
# than file lists: a task that adds a route under an area it already owns is
# ordinary work, and enumerating to the file would make every new file a
# contract edit for no gain -- the floor is what draws the line, and it draws
# it between directories.
# ---------------------------------------------------------------------------
writable_paths:
  - platform/app/api/analytics/campaign-revenue/**
  # churn: customers and dashboard, NOT intervene, which is floored
  - platform/app/api/analytics/churn/customers/**
  - platform/app/api/analytics/churn/dashboard/**
  - platform/app/api/analytics/customers/**
  - platform/app/api/analytics/dashboard/**
  - platform/app/api/analytics/geography/**
  - platform/app/api/analytics/orders/**
  - platform/app/api/analytics/products/**
  - platform/app/api/analytics/revenue/**
  - platform/app/api/analytics/segments/**
  - platform/app/api/analytics/setup-status/**
  - platform/app/api/analytics/sources/**
  - platform/app/api/analytics/sync/**
  # the pages. page.tsx and layout.tsx are named because the interventions
  # directory beside them is floored, so the tree cannot be globbed.
  - platform/app/(dashboard)/analytics/page.tsx
  - platform/app/(dashboard)/analytics/layout.tsx
  - platform/app/(dashboard)/analytics/churn/**
  - platform/app/(dashboard)/analytics/customers/**
  - platform/app/(dashboard)/analytics/geography/**
  - platform/app/(dashboard)/analytics/orders/**
  - platform/app/(dashboard)/analytics/products/**
  - platform/app/(dashboard)/analytics/revenue/**
  - platform/app/(dashboard)/analytics/segments/**
  - platform/app/(dashboard)/analytics/sources/**
  # NAMED COMPONENTS, NOT components/analytics/** AND CERTAINLY NOT
  # components/ui/**.
  #
  # These four are the ones the analytics pages import and nothing else does.
  # A fifth, AnalyticsSetupWizard.tsx, is deliberately absent: it is the
  # onboarding path a tenant connects a store through, not a report, and a
  # parity feature has no business in it.
  #
  # components/ui/** is out for the reason the retired contract's own header
  # gives about verification scope: data-table.tsx, stat-card.tsx and button.tsx
  # render on the campaigns, subscribers and billing pages too, and ten
  # analytics render tests would not show what a change there did to them. A
  # task that genuinely needs a shared primitive is a task a person widens this
  # file for.
  - platform/components/analytics/ChurnRiskBadge.tsx
  - platform/components/analytics/DateRangePicker.tsx
  - platform/components/analytics/SegmentCard.tsx
  - platform/components/analytics/TimeSeriesChart.tsx

# ---------------------------------------------------------------------------
# PROTECTED
#
# Every glob on protected_path_floor for this repo appears here verbatim: the
# database refuses a contract that omits one, and the omission is refused at
# INSERT rather than discovered later.
# ---------------------------------------------------------------------------
protected_paths:
  # the suite and its configuration, on the floor since 003 and 007
  - api/tests/**
  - api/pytest.ini
  - api/ruff.toml
  - api/alembic/**
  - api/analytics/migrations/**
  - platform/__tests__/**
  - platform/vitest.config.ts
  - platform/playwright.config.ts
  # 017: the email floor, api side
  - api/app.py
  - api/services/email_sender.py
  - api/worker.py
  - api/analytics/routes/interventions.py
  - api/analytics/services/trigger_router.py
  # 018 and 019: erasure. Reverting the commit does not bring the rows back
  - api/analytics/services/gdpr.py
  - api/services/gdpr_identity.py
  - api/services/gdpr_replay_scrub.py
  # 023: auth and session. middleware.ts is here because it is NOT under app/,
  # components/ or lib/ -- the retired wide contract missed it by accident
  - platform/middleware.ts
  - platform/lib/auth.ts
  - platform/lib/api-auth.ts
  - platform/lib/roles.ts
  - platform/lib/csrf.ts
  - platform/app/api/auth/**
  # 023: billing
  - platform/app/api/billing/**
  - platform/app/api/admin/billing/**
  - platform/app/(dashboard)/settings/billing/**
  # 023: email, the frontend half of 017
  - platform/app/api/campaigns/**
  - platform/app/api/flows/**
  - platform/app/api/domains/**
  - platform/app/api/suppression/**
  - platform/app/api/scheduled-campaigns/**
  - platform/app/api/inline-css/**
  - platform/app/api/listmonk/**
  - platform/app/(dashboard)/campaigns/**
  - platform/app/(dashboard)/flows/**
  - platform/app/(dashboard)/settings/domains/**
  # 023: the storefront event ingest
  - platform/app/api/track/**
  # 023: GDPR, the frontend half of 018 and 019
  - platform/app/api/gdpr/**
  - platform/app/(dashboard)/settings/privacy/**
  # 023: the intervention surface. INSIDE the analytics tree, which is why the
  # writable paths above are enumerated rather than globbed
  - platform/app/api/analytics/churn/intervene/**
  - platform/app/api/analytics/interventions/**
  - platform/app/(dashboard)/analytics/interventions/**

  # The backend is not this contract's business. Nothing here can verify a
  # change to it, so nothing here may make one.
  - api/**
  # Build, deploy and dependency manifests: a feature that needs one of these
  # is a change that needs a person, not a wider glob.
  - .github/**
  - platform/next.config.js
  - platform/package.json
  - platform/package-lock.json
  - platform/docker-compose.yml
  - platform/Dockerfile
  - platform/tsconfig.json

# ---------------------------------------------------------------------------
# ONE new test may be ADDED, and no existing test may be touched.
#
# platform/__tests__/** is floored as the suite that judges the work, and that
# argument is about MODIFICATION: an agent that edits an existing test can make
# it pass, and one that adds a file cannot weaken a test that already exists.
# Without this a frontend feature lands with nothing covering it and a green
# suite means "broke nothing" while reading as "verified" --
# specs/unattended-operation.md §3.2, and the hole
# contracts/dd-acquiring-page.yaml had to admit to in its own header.
#
# `.test.tsx`, NOT `.tsx`. vitest.config.ts includes
# `./__tests__/unit/**/*.{test,spec}.{ts,tsx}`, so a file named
# `test_fleet_foo.tsx` is created, committed, and never collected. That would
# not pass silently -- vitest_one_file.sh reports "no test file matched" as
# could-not-run -- but a glob that can only name a file the suite runs is
# better than a glob that fails clearly afterwards.
#
# 020 refuses any creatable glob not already inside a protected one, so this
# can only narrow protected_paths and never widen writable_paths. What stops
# the added test being vacuous is new_test_bites.sh below, not this -- the two
# are a pair.
# ---------------------------------------------------------------------------
creatable_paths:
  - platform/__tests__/unit/analytics/test_fleet_*.test.tsx

# ---------------------------------------------------------------------------
# THERE ARE NO `paired_paths` GROUPS HERE, AND THAT IS A DECISION.
#
# Two lived here until 10 Sep 2026: the dashboard proxy with the overview page
# (added for specs/dashboard-comparison-windows.md), and the orders proxy with
# the orders page (added the morning of 10 Sep, from
# drafts/order-filters-frontend.md). Both are removed, and
# contracts/checks/proxy_passthrough.py in the verification list below is what
# replaces them.
#
# WHY, IN ONE SENTENCE: both groups were a PROXY FOR A PROPERTY, and the
# property is now checked directly.
#
# The property either group was written to protect is FEAT-035 -- a page that
# sends a filter the proxy silently drops, so the control appears to work,
# returns unfiltered rows, and agrees with its own summary. "Both files move
# together" is not that property, and it is wrong in both directions:
#
#   IT REFUSED SAFE WORK. A pairing cannot tell "the page sends a parameter the
#   proxy does not forward" from "the page changed at all". Once both halves
#   have landed -- task 49 for the dashboard, task 53 for the orders filters --
#   the parameters agree and the danger is unreachable, but the group goes on
#   refusing every later single-file change to either file. TASK 55 IS THE
#   EVIDENCE: a click-to-filter change that introduced no parameter at all,
#   tsc green, 319 tests green, the added test proven to bite, failed on the
#   pairing alone at £2.25 and one attempt. drafts/order-table-cells-set-the-filters.md
#   predicted it in a section headed "Before this is queued", and nothing on
#   the unattended path read that section.
#
#   IT PASSED UNSAFE WORK. Co-movement is not agreement. A change that touched
#   both files and still left `has_discount` out of the proxy's list satisfies
#   every pairing rule there is. The failure the group existed to prevent fits
#   inside a diff it accepts.
#
# The replacement is directional, which a pairing cannot be. A proxy that
# forwards a name no page sends is dead code the next task notices, and is not
# refused. A page that sends a name no proxy forwards is a merchant reading an
# unfiltered figure as a filtered one, and is.
#
# WHAT IS LOST. Nothing checks that these files move together any more, and one
# thing that is genuinely a pairing goes with it: a NEW page under a NEW proxy,
# where the passthrough check has no entry in its PAIRS list and so has nothing
# to compare. That is a real hole and it is not closed here -- it is closed by
# whoever adds the page adding the pair, which is the same one line in a file a
# person already has open that this contract's writable_paths ask for.
#
# AND WHERE A ONE-SHOT PAIRING SHOULD HAVE GONE, since the next person to want
# one will read this. The orders group was a fact about ONE CHANGE -- task 53,
# introducing four parameters end to end -- written into a STANDING DOCUMENT,
# which is why it outlived what it was about by a day and cost a run. A group
# that expires belongs on the TASK ROW: `tasks.acceptance_contract` is a
# per-task copy, runner/cycle.py reads that copy and never this file, and
# 024_paired_paths.sql validates it there. Task 53 was a hand INSERT and could
# have carried it.
#
# There is no way to do that through console/autoqueue.py today: it resolves a
# contract FILE and copies it wholesale, so an autoqueued task gets exactly
# what is written here and nothing task-specific. So a one-shot pairing is
# available by hand INSERT and not on the unattended path -- which is the path
# everything now takes. Recorded rather than built: it wants a decision about
# where per-task contract narrowing lives, not a key bolted onto autoqueue.
# ---------------------------------------------------------------------------

# node_modules is gitignored, so a fresh worktree has none and neither tsc nor
# vitest can start. The runner links the checkout's own tree in AFTER the diff
# is derived and the boundary judged, so the agent never sees it.
#
# new_test_bites.sh needs the same thing in a tree the runner never touches --
# it materialises the pre-change tree with `git archive`, which contains no
# gitignored directory at all -- so vitest_one_file.sh links it there itself and
# removes the link afterwards. Before that, the bite check read "vitest could
# not start" as "the test failed, as it must" and would have passed every
# frontend task while running nothing.
worktree_links:
  platform/node_modules: /home/ubuntu/deadly-digital-platform/platform/node_modules

# THE ORDER IS THE ONE THE WORK WAS SPECIFIED IN. verify.run stops at the first
# failure, so a cheap check placed late is wall clock spent before a verdict
# that was available immediately: proxy_passthrough.py is two file reads and a
# set comparison, and moving it first would cost nothing and answer sooner. It
# is left last because the sequence "does it compile, does it pass, does the new
# test bite, does the page ask for anything the proxy drops" is the order a
# reader reasons in, and 95 seconds is not enough to buy a different one.
#
# THAT ARGUMENT IS NOW WEAKER THAN IT WAS, and it is left standing on purpose so
# the next person can overrule it: task 55 spent 107 seconds of tsc and vitest
# to be failed by the last line for a reason the last line could have given in
# under a second. Order costs nothing when everything passes and costs a run's
# wall clock when the cheap check is the one that fails.
verification:
  # FIRST, AND CHEAPEST. A git diff and a regex, well under a second.
  #
  # specs/auto-approval.md §9.12, built 10 Sep 2026. Every other check here is
  # a fact about the tree and none of them reads the spec: task 53 shipped its
  # §2.5 unbuilt with all of them green. `auto_merge: false` caught that and is
  # gone, and `draft_spec` came off console/automerge's NEVER_UNATTENDED the
  # same day, so nothing reads a spec at any point now.
  #
  # It proves a claim was MADE, not that it was MET -- an agent can write
  # `// spec:2.5` and change nothing. That is still worth the annotation cost,
  # because it turns a silent omission into a written, attributable one sitting
  # in the diff. Run against task 53's real spec and real diff it reports 8 of
  # 8 requirements cited nowhere.
  #
  # Ordered first on this file's own argument, three paragraphs up: task 55
  # spent 107 seconds of tsc and vitest to be failed by the last line for a
  # reason the last line could have given in under a second.
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/spec_requirements_cited.py
  - cd platform && ./node_modules/.bin/tsc --noEmit
  - cd platform && ./node_modules/.bin/vitest run --reporter=dot
  # The added test must FAIL against the tree before the change. The runner is
  # vitest rather than pytest, the suite directory is __tests__ rather than
  # tests, and the pattern is the creatable glob above.
  - FLEET_TEST_RUNNER=/home/ubuntu/fleet/contracts/checks/vitest_one_file.sh /home/ubuntu/fleet/contracts/checks/new_test_bites.sh platform '__tests__/unit/analytics/test_fleet_*.test.tsx' '__tests__'
  # Every parameter the orders page and the overview page send must be one
  # their proxy forwards. Replaces the two paired_paths groups -- see the long
  # comment above the writable list for why a pairing was the wrong shape.
  - python3 /home/ubuntu/fleet/contracts/checks/proxy_passthrough.py

# NOT ELIGIBLE FOR UNATTENDED MERGE, AND THE REASON IS NARROWER THAN "FRONTEND
# WORK IS RISKY".
#
# Every other gate here is a fact about the tree. proxy_passthrough.py
# establishes that the page asks for nothing the proxy drops; it cannot
# establish that the label the page renders describes the window the proxy
# asked for, or that the value a cell sends is the row's rather than the label
# rendered from it. Only a render test asserting that behaviour can, and the
# agent chooses what its test asserts -- new_test_bites.sh then proves the test
# discriminates between two trees, not that it discriminates on the property
# the spec asked for.
#
# So the one thing this contract exists to prevent is the one thing it cannot
# check, and a green run that reads as "the comparison label is right" would be
# the sixth check-that-could-not-fail in this codebase.
#
# REVISIT ONCE IT HAS RUN A FEW TIMES. If the added tests that arrive under this
# contract do assert the rendered sentence, the argument above weakens and this
# becomes a default worth inverting -- the same way
# contracts/deadly-digital-platform-api.yaml's `true` is scoped to the parity
# push rather than stated as a design.
# TRUE SINCE 10 SEP 2026, AND THIS IS THE ONE THAT COSTS SOMETHING.
#
# Scoped to the parity push and reversed at the first customer, on
# specs/unattended-operation.md §7's list with the rest. Deadly Digital has no
# users, HIB is not using it, and every change here is a revert away. That is
# the same argument deadly-digital-platform-api.yaml makes, and it holds here.
#
# WHAT THIS SPECIFIC FLIP LOSES, WRITTEN HERE BECAUSE THIS IS WHERE SOMEBODY
# WILL READ IT
# ---------------------------------------------------------------------------
# specs/auto-approval.md §9.9. On 10 Sep task 53 shipped §2.5 of its own spec
# unbuilt -- the order table's cells were to set the filters, and the diff did
# not touch row rendering at all. tsc passed, 319 vitest tests passed,
# new_test_bites.sh passed, paired_paths.py passed. NONE OF THEM CAN FAIL FOR
# A MISSING REQUIREMENT, and a fifth would not change that: tsc proves it
# compiles, the suite proves nothing broke, the bite check proves the ONE test
# the change added fails without it, and the pairing proves both halves of a
# pair moved.
#
# It was caught because this line said `false` and a person compared the spec
# to the diff. WITH IT TRUE, NOBODY MAKES THAT COMPARISON. The spec is still
# read once, when the draft is accepted -- but that reading judges whether the
# work is RIGHT, before it exists. Nothing afterwards asks whether it was DONE.
#
# AND THE CHECKLIST DOES NOT REACH THIS. The review page lists a spec's
# numbered requirements beside the diff (console/requirements.py, built 10 Sep
# for exactly this problem). It renders on /tasks/{id}. On the unattended path
# nobody opens /tasks/{id}: the task is queued by console/autoqueue.py, claimed
# by the runner, merged by automerge.py and deployed by run_autodeploy.py
# without a request ever being made. A reader that must be visited is not a
# reader on a path with no visitor. brief/pass_.py lists the requirements of
# anything merged unattended, which is the only surface a person is known to
# look at afterwards -- and "afterwards" is the whole of what is on offer here.
#
# So the honest statement is: a frontend feature can now ship with four of five
# requirements, every check green, nothing failed, and no revert triggered
# because there is nothing to revert. The first evidence is somebody using it.
# That is the trade, and it is the reason §7's reversal is about restoring a
# reader as much as about the cost of a bad merge.
auto_merge: true

# 600 rather than the retired contract's 800. A page, its proxy and one render
# test is a few hundred lines; a frontend diff approaching 800 under a contract
# this narrow is a task that found something the spec did not describe.
# THE SPEC MAY NOT NUMBER MORE REQUIREMENTS THAN THIS.
#
# A ceiling like max_diff_lines, checked at queue time BEFORE the money, and
# added 11 Sep 2026 after task 62 failed twice for the same reason in two
# different disguises: first £3.00 at the spend cap with no branch, then £5.02
# with 494 lines against a 400-line limit. Its spec numbers 25 requirements,
# and contracts/checks/spec_requirements_cited.py obliges the diff to cite
# every leaf of them.
#
# MEASURED, from the specs that actually merged under each work_type:
#
#     dd_api        4, 5, 5, 5      max 5
#     dd_frontend   8               max 8
#     research      17, 23          max 23   -- and deliberately NOT capped
#
# Research is uncapped because it produces a DOCUMENT: it has no diff limit to
# blow and its two merged specs numbered 17 and 23 without trouble. The failure
# this refuses is a code task's budget, and a document has none.
#
# 12: measured: the largest dd_frontend spec that merged numbers 8, doubled for headroom.
max_requirements: 12

max_diff_lines: 600

# 300: THE FIGURE THE AGENT IS TOLD. Guidance, exceedable, and nothing
# refuses against it. See contracts/deadly-digital-platform-api.yaml, which
# carries every measurement behind the pair of fields and the four days that
# produced them.
#
# THIS CONTRACT STILL HAS NO OBSERVATION OF ITS OWN. All three frontend tests
# were written while the test came out of max_diff_lines, so all three measure
# what the old shared limit left over rather than what a vitest file needs:
#
#   task 49   175    3 cases   failed on paired paths
#   task 55   177    5 cases   failed on paired paths
#   task 53   190    6 cases   MERGED
#
# It follows dd_api's figure for the reason it always has -- nothing of its own
# to set one with -- and that matters less now than it did this morning,
# because the figure is no longer a gate.
test_diff_target: 300

# 1200: A RUNAWAY BOUND, and the same one dd_api carries. Its job is to stop a
# pathological run, not to judge a test. The agent is never told it, and if it
# ever fires the question is what the agent did, not whether the number is
# right.
#
# The argument is entirely in the api contract and is not repeated: a line
# count cannot tell a thorough test from a bloated one, and the three gates
# that can -- new_test_bites.sh, creatable_paths, max_diff_lines -- are all in
# this file already. For this contract the demotion also retires a ceiling
# that had never refused anything and never had a sample worth trusting.
#
# max_diff_lines above is unchanged and counts production lines only, so it
# loosened by whatever the test costs without the number moving. Task 53's
# production half was 112 of its 302, which is the only evidence this contract
# has about its own production sizes -- too little to re-derive 600, so it
# stands.
max_test_diff_lines: 1200
# 6.00, measured 11 Sep 2026, was 3.00. PROVISIONAL -- it rests on two
# observations. The reasoning, the two runs it rests on, and what a
# re-measurement needs to replace are recorded once in
# contracts/deadly-digital-platform-api.yaml, because both observations are
# dd_api runs. In short: £3.00 stopped 4 of 13 code tasks, and the only two
# code runs ever allowed past it cost £5.02 and ~£5.50.
max_cost_gbp: 6.00
# tsc 29s + vitest 65s + the bite check ~9s (two single-file runs) + paired
# paths ~0s = ~105s of verification, out of one clock shared with the agent.
timeout_seconds: 1800
