# Task contract: make the acquiring-products report reachable. The default
# frontend contract plus this task's own acceptance check.
#
# writable_paths is narrowed to the two directories the new files live in and
# the one existing file that must change. The default contract opens the whole
# of platform/app, which is right in general and too wide here: the spec names
# a proxy route, a page and one sidebar entry, and a diff outside those three
# is a diff nobody scoped.
#
# platform/__tests__/** stays protected, so this task CANNOT add a render
# test for the page it builds. That is a real hole and the spec says so
# rather than pretending the existing 298 cover the new page.
work_type: dd_frontend
repo: deadly-digital-platform
base_branch: main
contract_version: 2

writable_paths:
  - platform/app/api/analytics/products/**
  - platform/app/(dashboard)/analytics/products/**
  - platform/components/layout/Sidebar.tsx

protected_paths:
  # The floor, which the database requires by name. Each is on it because
  # editing it defeats the thing that judges the work.
  - api/tests/**
  - api/pytest.ini
  - api/ruff.toml
  - api/alembic/**
  - api/analytics/migrations/**
  - platform/__tests__/**
  - platform/vitest.config.ts
  - platform/playwright.config.ts
  # The backend is not this contract's business. Nothing here can verify a
  # change to it, so nothing here may make one.
  - api/**
  # Build, deploy and dependency manifests: a feature that needs one of these
  # is a change that needs a person, not a wider glob.
  - .github/**
  - platform/next.config.js
  - platform/package.json
  - platform/package-lock.json
  - platform/docker-compose.yml
  - platform/Dockerfile
  - platform/tsconfig.json

  # 017: the email floor. Fleet does not go near email; these are on
  # protected_path_floor, so a contract omitting one cannot create a task.
  - api/app.py
  - api/services/email_sender.py
  - api/worker.py
  - api/analytics/routes/interventions.py
  - api/analytics/services/trigger_router.py
  # 018: erasure. Reverting the commit does not bring the rows back.
  - api/analytics/services/gdpr.py
  # 019: the rest of the erasure path.
  - api/services/gdpr_identity.py
  - api/services/gdpr_replay_scrub.py
  # 023: the platform floor. Auth and session, billing, the frontend half of
  # the email platform, the storefront ingest, GDPR, and the intervention
  # surface inside the analytics tree. Listed verbatim because the database
  # refuses a contract that omits one -- not because this contract is about
  # any of them.
  - platform/middleware.ts
  - platform/lib/auth.ts
  - platform/lib/api-auth.ts
  - platform/lib/roles.ts
  - platform/lib/csrf.ts
  - platform/app/api/auth/**
  - platform/app/api/billing/**
  - platform/app/api/admin/billing/**
  - platform/app/(dashboard)/settings/billing/**
  - platform/app/api/campaigns/**
  - platform/app/api/flows/**
  - platform/app/api/domains/**
  - platform/app/api/suppression/**
  - platform/app/api/scheduled-campaigns/**
  - platform/app/api/inline-css/**
  - platform/app/api/listmonk/**
  - platform/app/(dashboard)/campaigns/**
  - platform/app/(dashboard)/flows/**
  - platform/app/(dashboard)/settings/domains/**
  - platform/app/api/track/**
  - platform/app/api/gdpr/**
  - platform/app/(dashboard)/settings/privacy/**
  - platform/app/api/analytics/churn/intervene/**
  - platform/app/api/analytics/interventions/**
  - platform/app/(dashboard)/analytics/interventions/**
# node_modules is gitignored, so a fresh worktree has none and neither tsc
# nor vitest can start. The runner links the checkout's own tree in AFTER the
# diff is derived and the boundary judged, so the agent never sees it.
worktree_links:
  platform/node_modules: /home/ubuntu/deadly-digital-platform/platform/node_modules

# Both measured green on a worktree of main at 921e22b on 2026-08-30:
# tsc exits 0, vitest runs 19 files and 298 tests in 65s, and the checkout is
# untouched afterwards. There is no lint step because the platform has no
# eslint: `next lint` is unconfigured and prompts interactively, and eslint
# is not even a dependency. Inventing one here would be a gate nobody wrote.
verification:
  - cd platform && ./node_modules/.bin/tsc --noEmit
  - cd platform && ./node_modules/.bin/vitest run --reporter=dot
  - python3 /home/ubuntu/fleet/contracts/checks/acquiring_page_shape.py

# THE SPEC MAY NOT NUMBER MORE REQUIREMENTS THAN THIS.
#
# A ceiling like max_diff_lines, checked at queue time BEFORE the money, and
# added 11 Sep 2026 after task 62 failed twice for the same reason in two
# different disguises: first £3.00 at the spend cap with no branch, then £5.02
# with 494 lines against a 400-line limit. Its spec numbers 25 requirements,
# and contracts/checks/spec_requirements_cited.py obliges the diff to cite
# every leaf of them.
#
# MEASURED, from the specs that actually merged under each work_type:
#
#     dd_api        4, 5, 5, 5      max 5
#     dd_frontend   8               max 8
#     research      17, 23          max 23   -- and deliberately NOT capped
#
# Research is uncapped because it produces a DOCUMENT: it has no diff limit to
# blow and its two merged specs numbered 17 and 23 without trouble. The failure
# this refuses is a code task's budget, and a document has none.
#
# 12: inferred from the dd_frontend family; no spec of its own has merged, doubled for headroom.
max_requirements: 12

max_diff_lines: 800
# 6.00, measured 11 Sep 2026, was 3.00. PROVISIONAL -- it rests on two
# observations. The reasoning, the two runs it rests on, and what a
# re-measurement needs to replace are recorded once in
# contracts/deadly-digital-platform-api.yaml, because both observations are
# dd_api runs. In short: £3.00 stopped 4 of 13 code tasks, and the only two
# code runs ever allowed past it cost £5.02 and ~£5.50.
max_cost_gbp: 6.00
timeout_seconds: 1800
