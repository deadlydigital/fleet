# Task contract: turn a findings document into candidate rows.
#
# Candidates have existed only when a session was asked to write them by hand,
# so the loop never started on its own. This is the producer §7 of
# specs/approval-surface.md states the interface for and deliberately does not
# solve.
#
# WHY THIS IS A TASK AND NOT A PARSER
#
# WHICH DOCUMENT TO POINT THIS AT, AS OF 15 Sep 2026
#
# `specs/metorik-gap.md` is the document every batch so far was produced from:
# 50 rows, 48 Metorik features plus 2 DD capabilities with no counterpart, each
# carrying a DD status established by reading code or querying production, and
# each under a band-prefixed section heading.
#
# `research/metorik-report-catalogue-2026-09-15.md` is larger and newer -- 100
# reports from Metorik's published catalogue -- and IT IS NOT A DROP-IN
# REPLACEMENT. It carries no DD status and no band. `console/load_candidates.
# band_of` reads a candidate's band from the SECTION HEADING of the evidence it
# cites, and `console/rank.py` sorts a NULL band LAST (NO_BAND = 4), so a batch
# produced from that catalogue would be legal, unbanded, and would rank below
# every existing candidate forever -- silently, because nothing refuses it.
#
# Task 114 is classifying those 100 rows into three buckets and assigning each
# a band. Point this at `research/metorik-report-classification-2026-09-15.md`
# when it lands, and not before. Until then `specs/metorik-gap.md` remains the
# document with the two columns this pipeline needs.
#
# IT LANDED ON 15 SEP 2026 (task 114, merged as 92fad95), AND IT CARRIES TWO
# CORRECTION SECTIONS THAT THE NEXT PRODUCER SPEC MUST REPEAT. On 16 Sep 2026
# Eamonn stated four facts about the business, and they take 28 of the 100 rows
# out of the parity denominator as N/A rather than bucket B:
#
#   * HIB does not refund tickets      -- the 6-row Refunds group, and
#                                         `Net/gross revenue over time` becomes
#                                         A on its gross half
#   * HIB ships nothing                -- 3 rows (`By shipping method`,
#                                         `Shipping costs by shipping method`,
#                                         `By shipping location`)
#   * no VAT is charged on entries     -- 1 row (`Revenue by tax code, label
#                                         or ID`)
#   * HIB sells no recurring product   -- the whole 18-row Subscriptions block
#
# NONE OF THE 28 IS A GAP AND NONE MAY BE EMITTED. Every one is marked at its
# own row with `do not propose`. The standing parity figure is 30 of 72.
#
# CARTS (7) AND DEVICES (3) WERE CONSIDERED FOR THE SAME TREATMENT AND
# DELIBERATELY KEPT AS GAPS -- a cart is a funnel stage and a device split is a
# browser fact, and this store has both. They are proposable. Do not let the
# shape of the list above tempt a later agent into extending it by analogy.
#
# A FIFTH FACT MARKS FOUR ROWS `MUST SPLIT FREE ENTRIES` AND IS NOT A REFUSAL.
# 66,764 orders carry total = 0 and are the legal free-entry route a prize
# competition must offer. Those rows ARE candidates. What the mark requires is
# that the report state whether free entries are in or out, because they sit
# inside the revenue statuses and every mean of orders.total mixes them with
# paid ones. Do not read `MUST SPLIT` as `do not propose`; the document says so
# at each of the four rows and again in its third correction entry.
#
# ============================================================================
# WHY BATCH 16's CANDIDATES ALL KEY TO `topic:`, AND WHY THAT IS NOW HARMLESS
# ============================================================================
#
# Every one of batch 16's ten candidates keyed to `topic:` rather than `row:`,
# and six of them share ONE key. Recorded here so the next person does not
# rediscover it and, more importantly, DOES NOT TRY THE OBVIOUS FIX, WHICH
# MAKES IT WORSE.
#
# Why it happens: console/work_key.py resolves a cited section heading against
# the document to the TABLE ROW it names, and an ambiguous heading resolves to
# nothing. In specs/metorik-gap.md a section heading named one row, so the
# resolution was 1:1. In the classification a section heading is a GROUP
# heading over as many as eighteen rows, so every candidate produced from it
# keys to the group instead.
#
# THE OBVIOUS FIX DOES NOT WORK. Citing TWO evidence entries -- the group
# heading for band_of and the row title for work_key -- was tried against the
# real functions on 16 Sep 2026 and returns key=None, kind=None, which is
# WEAKER than the topic key it replaces. derive() builds a key per citation and
# refuses outright when they differ: "one candidate is one row, and choosing
# between them here would be a guess." It cannot tell a group from a row it
# contains, because document_rows() returns a flat list of row slugs with no
# section membership. Citing the row ALONE keys correctly and then loses the
# band, which is worse again -- rank.py sorts a band-less row last forever.
#
# So the citation shape in batch 16 is correct as it stands: cite the row's own
# `### Band — Group` heading, one entry, and accept a topic key.
#
# WHAT WAS FIXED INSTEAD, because the harm was never the key -- it was one
# consumer of it. 047 makes candidate_work_identity() ignore a non-`#row:` key
# and fall back to (title, repo), which is what console/rank.py has always done
# for supersede: "a topic key is stable only while the producer keeps quoting
# the heading the same way, so it does not get to call two rows the same work."
# The ceiling and the ranker now agree. Before 047 the ceiling fired at 2 on a
# shared topic key, so two failures among those six reports would have stopped
# four that were never tried.
#
work_type: candidate_producer
repo: fleet
# `master` since 9 Sep 2026: track-2-foundation and spec/daily-brief were
# consolidated into it and it is the trunk. A task's base branch is immutable once it
# exists, so getting this wrong means abandoning the task rather
# than editing it.
base_branch: master
contract_version: 1

# ONE file, and now a DATED PATTERN rather than one dated name.
#
# specs/auto-approval.md §8.1 named this as the blocker it was: the value here
# was the literal `research/candidates-metorik-gap-2026-09-09.md`, so the
# SECOND run of this task needed a contract edit before it could write
# anything, and a timer firing against an unedited contract would produce a
# task that cannot write its output. That is a contract that works exactly
# once.
#
# The glob is still one file per batch -- `*` does not cross a directory
# separator here, so `research/candidates-metorik-gap-2026-09-10/anything.md`
# is outside it -- and candidate_block_shape.py independently refuses a change
# touching more than one markdown file. The task's spec names the day's
# filename; this says which names are permissible.
writable_paths:
  - research/candidates-metorik-gap-*.md

protected_paths:
  # the fleet floor, which the database requires by name
  - contracts/**
  - tests/**
  - runner/**
  - console/**
  - detectors/**
  - proposer/**
  - systemd/**
  - specs/**
  - .env
  - 001_v1_core.sql
  - 001_v1_core_assertions.sql
  - 001_v1_core_fixtures.sql
  - 002_proposals.sql
  - 002_proposals_assertions.sql
  - 003_tasks.sql
  - 003_tasks_assertions.sql
  - 004_console_reader.sql
  - 004_console_reader_assertions.sql
  - 005_console_decisions.sql
  - 005_console_decisions_assertions.sql
  - 006_verdict_coverage.sql
  - 006_verdict_coverage_assertions.sql
  - 007_research_floor.sql
  - 007_research_floor_assertions.sql

# Read, never write. Snapshotted whole-tree before and after: --add-dir grants
# read access and nothing makes it read-only, so a write here would land
# outside the worktree's index and the derived diff would show nothing.
readable_repos:
  - deadly-digital-platform

# No Bash, and no web. See the header: the absence of a shell is what makes
# the §7 prohibitions structural rather than requested.
agent_tools:
  - Read
  - Grep
  - Glob
  - Write
  - Edit

verification:
  # The same floor every research document meets: it exists, is substantial,
  # is dated, names evidence, states what it could not verify, and its cited
  # paths resolve.
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/research_document_shape.py
  # And the block itself, with every probe re-executed at HEAD.
  #
  # --max-candidates IS THE CEILING AND IT LIVES HERE. Fifteen unshipped rows
  # against an approval batch cap of 5 is fine, because listing is cheap and
  # ticking is the work. A sixty-row findings document flooding the surface is
  # not, and the limit belongs to the contract rather than to whoever writes
  # the next document.
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/candidate_block_shape.py --max-candidates 10

max_diff_lines: 2000
# 6.00, measured 11 Sep 2026, was 5.00. Three producer runs have completed:
# £3.84, £4.10, £4.90 -- mean £4.28, sd £0.55, and the dearest is 98% of the
# old £5.00 ceiling. None has been stopped by it yet, which is the argument for
# moving it before one is. 6.00 is mean+3sd and 23% above the dearest.
max_cost_gbp: 6.00
timeout_seconds: 3600
