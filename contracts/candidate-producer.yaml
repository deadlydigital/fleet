# Task contract: turn a findings document into candidate rows.
#
# Candidates have existed only when a session was asked to write them by hand,
# so the loop never started on its own. This is the producer §7 of
# specs/approval-surface.md states the interface for and deliberately does not
# solve.
#
# WHY THIS IS A TASK AND NOT A PARSER
#
# WHICH DOCUMENT TO POINT THIS AT, AS OF 15 Sep 2026
#
# `specs/metorik-gap.md` is the document every batch so far was produced from:
# 50 rows, 48 Metorik features plus 2 DD capabilities with no counterpart, each
# carrying a DD status established by reading code or querying production, and
# each under a band-prefixed section heading.
#
# `research/metorik-report-catalogue-2026-09-15.md` is larger and newer -- 100
# reports from Metorik's published catalogue -- and IT IS NOT A DROP-IN
# REPLACEMENT. It carries no DD status and no band. `console/load_candidates.
# band_of` reads a candidate's band from the SECTION HEADING of the evidence it
# cites, and `console/rank.py` sorts a NULL band LAST (NO_BAND = 4), so a batch
# produced from that catalogue would be legal, unbanded, and would rank below
# every existing candidate forever -- silently, because nothing refuses it.
#
# Task 114 is classifying those 100 rows into three buckets and assigning each
# a band. Point this at `research/metorik-report-classification-2026-09-15.md`
# when it lands, and not before. Until then `specs/metorik-gap.md` remains the
# document with the two columns this pipeline needs.
#
# A parser over specs/metorik-gap.md yields 50 rows, 14 of them already
# shipped, and -- worse -- the 34 marked Missing or Partial are 11 days old.
# Probed against platform HEAD ebe016c on 8 Sep 2026, two of four Daily-band
# rows were already wrong: order filtering now accepts payment_method,
# country, coupon and has_discount where the document says "nothing else", and
# the location report has the page the document says it lacks. Those are
# exactly the two a person caught by hand when batch 8 was assembled.
#
# So parsing is trivial and RE-VERIFICATION IS THE WORK. Every candidate
# declares predicates that candidate_block_shape.py re-executes at HEAD; a row
# whose claim has stopped being true cannot be emitted.
#
# AND SINCE 10 SEP 2026, A `premise` AS WELL AS `probes`. WHOEVER QUEUES THE
# NEXT PRODUCER TASK MUST SAY SO IN ITS SPEC, the way task 50's spec carried a
# section headed "Two things the check now requires that it did not for batch
# 9". The check refuses a block without one, and an agent that has not been
# told will spend a run discovering it.
#
# What it is: what must ALREADY be true for the work to be the work described,
# as a claim in words and one predicate from the same closed vocabulary.
# `probes` show the GAP is real; a premise shows the GROUND is there. Candidate
# 38 carried four probes that all held and rested on the order table having
# three columns it had never had -- £2.25, and an agent that correctly added
# them because they were the only way to do what it had been asked. See
# specs/auto-approval.md §9.9.1 and 030_candidate_premise.sql.
#
# AND SINCE 15 SEP 2026, A `measured_impact` AS WELL. THE SAME WARNING APPLIES:
# WHOEVER QUEUES THE NEXT PRODUCER TASK MUST SAY SO IN ITS SPEC. The check
# refuses a block that omits the key, and an agent that has not been told will
# spend a run discovering it.
#
# What it is: how much the work is worth, MEASURED NOW, as
# {value, unit, what, dataset, as_of} -- or an explicit `null`. The key is
# required; the value very often is null, because most work has no latency
# figure and never will. A CSV export is worth building and is not worth
# milliseconds.
#
#   measured_impact:
#     value: 619
#     unit: ms                    # the vocabulary is closed at this one member
#     what: the top_products statement, per dashboard request
#     dataset: tenant 166, dashboard at a 30-day window, median of three warm
#              passes on a quiet box
#     as_of: 2026-09-14
#
# THREE RULES, AND EACH COST SOMETHING TO LEARN:
#
#   * TRANSCRIBE, DO NOT ESTIMATE. The figure comes from the findings document
#     you were given. This contract grants no Bash and no database, so you
#     cannot measure anything -- and a number you reasoned your way to is not
#     what this key is for. If the document states no figure, write `null`.
#
#   * MEASURED, NEVER PROJECTED. Candidate 67's loop is 89 ms today and its
#     research argues it becomes ~1.8 s on a two-year store. The 89 goes here;
#     the 1.8 s goes in `rationale`, where a reader weighs it. A producer free
#     to choose the horizon is a producer choosing which row wins.
#
#   * THE DATASET AND THE DATE ARE NOT DECORATION. Nothing re-executes this
#     number -- not this check, not the ranker, not the approval. Every other
#     claim you make in a block is a predicate something runs against the tree.
#     This one is a claim, and the dataset and date are the whole of what lets
#     a reader check it against the document you took it from.
#
# Why it exists: console/rank.py's first four keys are all properties of a
# row's FORM -- what kind of work, whether its data exists, how often it is
# wanted, whether it has been tried. None is how much the work is WORTH.
# Candidates 66 and 67 tied on all four for 15 consecutive sweeps and approved
# nothing, while the document they were both loaded from timed them at 619 ms
# and 89 ms. See 045_measured_impact.sql.
#
# THE PROHIBITIONS ARE IN THIS FILE, NOT IN A PROMPT
#
# §7 forbids a producer to set a disposition, to write to `tasks`, and to
# deduplicate against previous batches. Four things enforce that here, and
# none of them is an instruction the agent could disregard:
#
#   * agent_tools has NO Bash, so there is no shell
#   * .env is gitignored and therefore absent from a fresh worktree, so there
#     is no credential and no route to the database at all
#   * writable_paths is ONE file per batch -- a dated pattern that
#     matches one name, never a directory
#   * candidate_block_shape.py REFUSES a block containing disposition,
#     work_type, batch_id, spec_task_id or work_task_id -- the shape cannot
#     express pre-approval
#
# The third prohibition follows from the second: the agent is given the
# findings document and the platform repository, and never `candidates`. It
# cannot deduplicate because it cannot see what came before -- which is what
# keeps a reappearing candidate a signal.
#
# RE-RUN, DO NOT RECONCILE. A batch two weeks old is a new batch. This task is
# run again against the same document; it does not update rows in place, for
# the reason §5 keeps a NOT_NOW candidate's original batch_id -- a candidate
# that reappears is signal, and quietly refreshing it erases that.
#
# NO WEB ACCESS, unlike research.yaml. This task re-verifies claims about a
# repository, and the claims it cannot check -- whether Metorik still ships a
# feature, whether merchants want one -- are not made more checkable by
# fetching a marketing page. Dropping WebSearch and WebFetch removes the
# reproducibility problem that contract has to manage rather than managing it.

work_type: candidate_producer
repo: fleet
# `master` since 9 Sep 2026: track-2-foundation and spec/daily-brief were
# consolidated into it and it is the trunk. A task's base branch is immutable once it
# exists, so getting this wrong means abandoning the task rather
# than editing it.
base_branch: master
contract_version: 1

# ONE file, and now a DATED PATTERN rather than one dated name.
#
# specs/auto-approval.md §8.1 named this as the blocker it was: the value here
# was the literal `research/candidates-metorik-gap-2026-09-09.md`, so the
# SECOND run of this task needed a contract edit before it could write
# anything, and a timer firing against an unedited contract would produce a
# task that cannot write its output. That is a contract that works exactly
# once.
#
# The glob is still one file per batch -- `*` does not cross a directory
# separator here, so `research/candidates-metorik-gap-2026-09-10/anything.md`
# is outside it -- and candidate_block_shape.py independently refuses a change
# touching more than one markdown file. The task's spec names the day's
# filename; this says which names are permissible.
writable_paths:
  - research/candidates-metorik-gap-*.md

protected_paths:
  # the fleet floor, which the database requires by name
  - contracts/**
  - tests/**
  - runner/**
  - console/**
  - detectors/**
  - proposer/**
  - systemd/**
  - specs/**
  - .env
  - 001_v1_core.sql
  - 001_v1_core_assertions.sql
  - 001_v1_core_fixtures.sql
  - 002_proposals.sql
  - 002_proposals_assertions.sql
  - 003_tasks.sql
  - 003_tasks_assertions.sql
  - 004_console_reader.sql
  - 004_console_reader_assertions.sql
  - 005_console_decisions.sql
  - 005_console_decisions_assertions.sql
  - 006_verdict_coverage.sql
  - 006_verdict_coverage_assertions.sql
  - 007_research_floor.sql
  - 007_research_floor_assertions.sql

# Read, never write. Snapshotted whole-tree before and after: --add-dir grants
# read access and nothing makes it read-only, so a write here would land
# outside the worktree's index and the derived diff would show nothing.
readable_repos:
  - deadly-digital-platform

# No Bash, and no web. See the header: the absence of a shell is what makes
# the §7 prohibitions structural rather than requested.
agent_tools:
  - Read
  - Grep
  - Glob
  - Write
  - Edit

verification:
  # The same floor every research document meets: it exists, is substantial,
  # is dated, names evidence, states what it could not verify, and its cited
  # paths resolve.
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/research_document_shape.py
  # And the block itself, with every probe re-executed at HEAD.
  #
  # --max-candidates IS THE CEILING AND IT LIVES HERE. Fifteen unshipped rows
  # against an approval batch cap of 5 is fine, because listing is cheap and
  # ticking is the work. A sixty-row findings document flooding the surface is
  # not, and the limit belongs to the contract rather than to whoever writes
  # the next document.
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/candidate_block_shape.py --max-candidates 10

max_diff_lines: 2000
# 6.00, measured 11 Sep 2026, was 5.00. Three producer runs have completed:
# £3.84, £4.10, £4.90 -- mean £4.28, sd £0.55, and the dearest is 98% of the
# old £5.00 ceiling. None has been stopped by it yet, which is the argument for
# moving it before one is. 6.00 is mean+3sd and 23% above the dearest.
max_cost_gbp: 6.00
timeout_seconds: 3600
