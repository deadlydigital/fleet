# The draft-spec contract. A task that writes a SPEC for another task.
#
# specs/approval-surface.md §3, decided 7 Sep 2026. A ticked candidate produces
# one of these, not a code task. The reason is measured rather than assumed:
# two hand-written specs contained factual errors about file paths, and an
# overnight batch would have built five branches against wrong ones. That error
# class is factual claims about the repository, so it is checkable -- and
# contracts/checks/draft_spec_shape.py is what makes it something a task cannot
# pass with rather than something a reviewer must catch.
#
# WHAT DIFFERS FROM contracts/research.yaml, AND IT IS ONE THING
#
# The research contract gives the agent no shell, no credential, no database
# and NO SIGHT OF THE REPOSITORY -- the runner assembles an evidence pack
# beforehand. That trade is right for a research document. It is wrong for a
# spec, and §3.1 says why: a pre-assembled pack requires its author to already
# know which files matter, and anyone who knew that could have written the spec.
#
# So this contract adds a READ-ONLY checkout of the target repository and
# nothing else. Everything else the research contract buys survives:
#
#   no shell            unchanged
#   no credential       unchanged; .env is gitignored so absent from a worktree
#   no database         unchanged
#   one writable file   unchanged -- the spec, and the check refuses any other
#   frozen contract     unchanged; the database freezes it once RUNNING
#
# Only the blindness goes. The agent can read the tree it is writing about; it
# still cannot run anything in it, reach anything outside it, or write to it.
#
# THE COST, STATED. Reading the tree is how the agent learns which paths exist.
# It is also how a stale or wrong file teaches it something untrue. The check
# catches the first class and nothing catches the second, which is why this step
# ends in a human review rather than a merge.
#
# AND THE AGENT THAT WILL READ WHAT YOU WRITE HAS NO SHELL EITHER
#
# Everything above is about the tools THIS task has. The three lines below are
# about the tools the task you are writing FOR will have, and they were missing
# from this file until 15 Sep 2026, which cost GBP 9.89 in two days:
#
#   Read  Edit  Write  Grep  Glob
#
# That is runner.yaml's default set and most contracts take it unchanged --
# deadly-digital-platform-api.yaml does. It means the build agent CANNOT run
# the code, query a database, time a request, take an EXPLAIN plan, or reach
# anything outside its worktree. It can read files, search them, and edit them.
#
# SO A NUMBERED REQUIREMENT MUST BE SATISFIABLE BY EDITING A FILE. If a
# requirement asks for a measurement, a production identity proof, a before-and-
# after timing, or a named dataset the agent would have to go and observe, the
# agent cannot do it and cannot honestly cite it -- and
# contracts/checks/spec_requirements_cited.py refuses the branch for the missing
# citation. The code can be perfect and the run still dies.
#
# TWICE, ON THE SAME MISTAKE:
#
#   task 102   GBP 4.74   requirements 5 and 6 asked for an identity proof on
#              production data and a before/after EXPLAIN comparison. Five
#              checks green including a 15.4-minute analytics suite. The agent
#              tried python3, psql and docker exec, was refused at the
#              permission layer, said so plainly in its reply, and left them
#              uncited -- which is exactly what the citation check's own
#              failure text asks for. FAILED at max_attempts 1.
#
#   task 109   GBP 5.15   requirements 6 and 7, written by THIS contract's
#              agent five days later, asked for "the identity is proved on
#              production data, per period, with the dataset named" and
#              "report the statement count and the time, before and after".
#              Five checks green. Same refusal, same dead run.
#
# WHAT TO DO INSTEAD, and task 104's spec
# (specs/lateral-acquiring-order-in-three-call-sites.md) is the worked example
# that shipped:
#
#   * STATE MEASUREMENTS AS GIVEN. Put the figures in a table near the top
#     under a heading saying they are given and nothing is to be measured. The
#     agent can then cite them truthfully because the claim is "I built what
#     this number argues for", not "I measured this".
#
#   * PUT THE PROOF IN A SECTION THAT IS NOT A NUMBERED REQUIREMENT. Task 104
#     used "What this task does NOT include", named the script a person runs,
#     and told the agent not to cite it, not to claim it and not to write a
#     token over it. The work still happens; it is simply not the branch's to
#     do.
#
#   * IF YOU CANNOT STATE THE FIGURE, SAY SO AND STOP. A spec that needs a
#     measurement nobody has taken is not ready to be queued. Write that in the
#     draft rather than numbering a requirement to stand in for it.
#
# The rule in one line, and it is the one to keep: A SPEC MUST NOT NUMBER WORK
# ITS OWN AGENT HAS NO TOOLS TO PERFORM.
#
# EXCEPT THAT A RESEARCH SPEC CAN ASK FOR READINGS, IF IT DECLARES THEM
#
# The one route from a spec to a number, and it is not a shell. A fleet-spec
# block may carry an `evidence_queries` list, and the runner runs those queries
# BEFORE the agent starts -- as a read-only role holding SELECT and nothing
# else -- and writes the answers into the worktree as a markdown file the agent
# reads like any other. The agent still cannot reach a database; the runner
# reached it on the agent's behalf and the questions were fixed in advance.
#
#   evidence_queries:
#     - key: tp_01_table_facts          # names the reading in the pack
#       reader: deadly_digital          # or `fleet`; those two and no others
#       sql: |
#         SELECT count(*) AS rows FROM analytics_2.order_items
#
# WHAT THE RUNNER'S SHAPE DEMANDS OF THE BLOCK, because getting any of these
# wrong produces a pack full of errors rather than readings. All four are
# properties of runner/evidence.py and research/top-products-index-pricing.md
# §5 derives them with line numbers:
#
#   * The session is READ-ONLY and the role holds SELECT. `CREATE EXTENSION`
#     cannot be in a pack. An extension must already be installed out of band.
#   * Order is preserved WITHIN a reader, on one connection, so session state
#     carries from one query to the next -- which is what lets a multi-step
#     protocol work. Keep such a run contiguous and do not interleave.
#   * Every query must RETURN ROWS. `fetchall()` on a statement with no result
#     set raises, and the pack records that as an error.
#   * Prefer `EXPLAIN (FORMAT JSON)` to the default text: the pack renders rows
#     as a markdown table, so a 20-line text plan becomes 20 rows.
#
# AND WHAT YOU MAY NOT ASK FOR. A task-authored query may not read `tenants`:
# the pack is written to a path the contract declares writable and is therefore
# COMMITTED, and that table carries `api_key`. Values shaped like a credential
# are redacted out of a task-authored result whatever table they came from.
# contracts/checks/draft_spec_shape.py refuses a block the runner would refuse,
# here, before the money.
#
# IF YOU NEED A READING AND CANNOT DECLARE IT -- the table is not granted to
# either reader, or the question needs a shell -- then say so in the draft and
# do not number it as a requirement. That is the rule above, unchanged.

work_type: draft_spec
repo: fleet
# `master` since 9 Sep 2026, when track-2-foundation and spec/daily-brief were
# consolidated into it. This said track-2-foundation until 9 Sep 2026, copying a
# line research.yaml wrote before the consolidation; the two refs are the same
# commit today, so nothing queued from here has branched wrongly yet.
#
# It is corrected now rather than when it breaks because a task's base branch is
# immutable once the row exists: the morning master moves, every task already
# queued against the stale ref is repaired by ABANDONING it, not by editing it.
# console/approve.py reads this key rather than carrying its own literal, so
# there is one place to change and it is this one.
base_branch: master
contract_version: 1

# ONE FILE. A draft spec is a document; anything else in the diff is something
# nobody asked for, and the check refuses a diff containing non-markdown.
# ONE DIRECTORY, AND IT IS NOT `specs/`. The fleet floor protects `specs/**`
# because "a task that could edit its own spec could edit the instructions it is
# judged against" -- and a draft-spec task writing into specs/ would be exactly
# that. So drafts land here and PROMOTING ONE TO specs/ IS A HUMAN ACT, which
# preserves the floor's reasoning rather than carving an exception out of it.
#
# Found by the database refusing the first version of this contract. The floor
# is enforced by enforce_contract_floor() on task insert, so a contract that
# does not cover it cannot create a task at all.
writable_paths:
  - drafts/**

# Generated from protected_path_floor for repo 'fleet' rather than typed. A
# typed copy drifts, which is how the conftest migration list came to be two
# behind, and here a drifted copy means tasks that cannot be created.
protected_paths:
  - 001_v1_core_assertions.sql
  - 001_v1_core_fixtures.sql
  - 001_v1_core.sql
  - 002_proposals_assertions.sql
  - 002_proposals.sql
  - 003_tasks_assertions.sql
  - 003_tasks.sql
  - 004_console_reader_assertions.sql
  - 004_console_reader.sql
  - 005_console_decisions_assertions.sql
  - 005_console_decisions.sql
  - 006_verdict_coverage_assertions.sql
  - 006_verdict_coverage.sql
  - 007_research_floor_assertions.sql
  - 007_research_floor.sql
  - console/**
  - contracts/**
  - detectors/**
  - .env
  - proposer/**
  - runner/**
  - specs/**
  - systemd/**
  - tests/**

# THE ONE ADDITION. A read-only checkout of the repository the spec is about,
# linked in after the diff is derived and the boundary judged -- the same
# mechanism the platform contract uses for node_modules, and for the same
# reason: the agent must not be able to make it part of the diff.
#
# Read-only is enforced by the link target being a checkout the runner owns and
# the agent's writable set being specs/drafts/** alone. The agent has no shell,
# so it cannot chmod its way out.
worktree_links:
  reference/deadly-digital-platform: /home/ubuntu/deadly-digital-platform

# READ, NEVER WRITTEN, AND NOW DECLARED RATHER THAN INFERRED FROM THE NAME.
#
# runner/verify.unwritable probes every linked tree by writing to it, because a
# tool dying on a read-only mount exits normally and cannot be told from a
# failing test -- vitest's EROFS on node_modules/.vite was reported as task 53's
# branch failing to verify. That probe is right for a dependency tree tools
# write caches into. It is wrong here, and asserting it refused the accept of
# task 71 on 12 Sep 2026:
#
#     .../fleet-accept-trial-71/reference/deadly-digital-platform is not
#     writable (Read-only file system)
#
# The console has ProtectHome=read-only and no ReadWritePaths -- correct, and
# made so on 11 Sep when the merge moved into a throwaway clone. Nothing was
# wrong with the confinement; the question should not have been asked.
#
# NOTHING WRITES THROUGH THIS LINK. The agent never sees it -- the runner
# creates it after the diff is derived, deliberately, and three specs died
# believing otherwise. The paths pack reads the link's TARGET rather than the
# link. And draft_spec_shape.py, the only command below, resolves
# `REPO_ROOT / repo` directly and does not mention `reference/`.
#
# The link STAYS, unused at verification time, because it is the shape any
# future check that wants to read the tree would ask for. Declaring it read-only
# is cheaper than removing it and rebuilding it later.
read_only_links:
  - reference/deadly-digital-platform

# THE TREE, LISTED BY THE RUNNER, BEFORE THE AGENT WRITES A LINE.
#
# Three specs failed on paths and every failing one had a real sibling in the
# same directory: `routes/orders.py` beside a genuine
# `api/analytics/routes/orders.py`. That is recall, not knowledge, and asking
# the prompt to try harder puts the burden back on the thing that already
# failed three times. So the paths are put in front of it.
paths_pack:
  file: reference/PATHS.md
  base: reference/deadly-digital-platform
  roots:
    - api/analytics
    - platform/app/(dashboard)/analytics

# THE GATE, MADE REACHABLE DURING THE RUN, AND CAPPED.
#
# The check ran after the agent exited, so three fixes of seconds each went
# unmade and the tasks died terminally. self_check runs the contract's FIRST
# verification command -- the same command, not a copy -- so the preview
# cannot drift from the gate.
#
# self_check_max is 3: one to discover, one to confirm the fix, one spare for
# a second distinct problem. An agent that could run it without limit could
# mutate paths until green, which satisfies the check without establishing
# what the file is -- a worse outcome than the failure, because it passes.
# Every invocation is recorded on the PATCH_PROPOSED step.
self_check: true
self_check_max: 3

# Bash is absent from the default tool list on purpose (see runner.yaml), and
# this widens it by exactly ONE command with no argument wildcard. The script
# lives under contracts/**, which is protected, so the agent cannot edit the
# thing it is allowed to run; and the runner still runs the real verification
# after the agent exits, so this never becomes the gate.
agent_tools:
  - Read
  - Edit
  - Write
  - Grep
  - Glob
  - Bash(/home/ubuntu/fleet/contracts/checks/spec_selfcheck.sh)

verification:
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/draft_spec_shape.py

# Smaller than research on every axis. A spec is shorter than an investigation,
# and this step is deliberately cheap because its whole purpose is to make the
# expensive step (a code task on a wrong path) not happen.
max_diff_lines: 400
# 2.50, measured 11 Sep 2026, was 2.00. Twelve draft specs have completed:
# mean £1.64, sd £0.29, max £1.97 -- 98% of the old ceiling. That is a
# distribution pressed against a wall, not one that fits under it, and task 66
# (run 36) was stopped by the cap having produced no branch and no diff.
# 2.50 is mean+3sd and 27% above the dearest spec that has ever finished, so a
# spec that reaches it is an outlier rather than an ordinary long one. This
# family is tight and well sampled, so it does not need the headroom code does.
max_cost_gbp: 2.50
timeout_seconds: 1800
