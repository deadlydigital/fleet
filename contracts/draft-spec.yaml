# The draft-spec contract. A task that writes a SPEC for another task.
#
# specs/approval-surface.md §3, decided 7 Sep 2026. A ticked candidate produces
# one of these, not a code task. The reason is measured rather than assumed:
# two hand-written specs contained factual errors about file paths, and an
# overnight batch would have built five branches against wrong ones. That error
# class is factual claims about the repository, so it is checkable -- and
# contracts/checks/draft_spec_shape.py is what makes it something a task cannot
# pass with rather than something a reviewer must catch.
#
# WHAT DIFFERS FROM contracts/research.yaml, AND IT IS ONE THING
#
# The research contract gives the agent no shell, no credential, no database
# and NO SIGHT OF THE REPOSITORY -- the runner assembles an evidence pack
# beforehand. That trade is right for a research document. It is wrong for a
# spec, and §3.1 says why: a pre-assembled pack requires its author to already
# know which files matter, and anyone who knew that could have written the spec.
#
# So this contract adds a READ-ONLY checkout of the target repository and
# nothing else. Everything else the research contract buys survives:
#
#   no shell            unchanged
#   no credential       unchanged; .env is gitignored so absent from a worktree
#   no database         unchanged
#   one writable file   unchanged -- the spec, and the check refuses any other
#   frozen contract     unchanged; the database freezes it once RUNNING
#
# Only the blindness goes. The agent can read the tree it is writing about; it
# still cannot run anything in it, reach anything outside it, or write to it.
#
# THE COST, STATED. Reading the tree is how the agent learns which paths exist.
# It is also how a stale or wrong file teaches it something untrue. The check
# catches the first class and nothing catches the second, which is why this step
# ends in a human review rather than a merge.

work_type: draft_spec
repo: fleet
# `master` since 9 Sep 2026, when track-2-foundation and spec/daily-brief were
# consolidated into it. This said track-2-foundation until 9 Sep 2026, copying a
# line research.yaml wrote before the consolidation; the two refs are the same
# commit today, so nothing queued from here has branched wrongly yet.
#
# It is corrected now rather than when it breaks because a task's base branch is
# immutable once the row exists: the morning master moves, every task already
# queued against the stale ref is repaired by ABANDONING it, not by editing it.
# console/approve.py reads this key rather than carrying its own literal, so
# there is one place to change and it is this one.
base_branch: master
contract_version: 1

# ONE FILE. A draft spec is a document; anything else in the diff is something
# nobody asked for, and the check refuses a diff containing non-markdown.
# ONE DIRECTORY, AND IT IS NOT `specs/`. The fleet floor protects `specs/**`
# because "a task that could edit its own spec could edit the instructions it is
# judged against" -- and a draft-spec task writing into specs/ would be exactly
# that. So drafts land here and PROMOTING ONE TO specs/ IS A HUMAN ACT, which
# preserves the floor's reasoning rather than carving an exception out of it.
#
# Found by the database refusing the first version of this contract. The floor
# is enforced by enforce_contract_floor() on task insert, so a contract that
# does not cover it cannot create a task at all.
writable_paths:
  - drafts/**

# Generated from protected_path_floor for repo 'fleet' rather than typed. A
# typed copy drifts, which is how the conftest migration list came to be two
# behind, and here a drifted copy means tasks that cannot be created.
protected_paths:
  - 001_v1_core_assertions.sql
  - 001_v1_core_fixtures.sql
  - 001_v1_core.sql
  - 002_proposals_assertions.sql
  - 002_proposals.sql
  - 003_tasks_assertions.sql
  - 003_tasks.sql
  - 004_console_reader_assertions.sql
  - 004_console_reader.sql
  - 005_console_decisions_assertions.sql
  - 005_console_decisions.sql
  - 006_verdict_coverage_assertions.sql
  - 006_verdict_coverage.sql
  - 007_research_floor_assertions.sql
  - 007_research_floor.sql
  - console/**
  - contracts/**
  - detectors/**
  - .env
  - proposer/**
  - runner/**
  - specs/**
  - systemd/**
  - tests/**

# THE ONE ADDITION. A read-only checkout of the repository the spec is about,
# linked in after the diff is derived and the boundary judged -- the same
# mechanism the platform contract uses for node_modules, and for the same
# reason: the agent must not be able to make it part of the diff.
#
# Read-only is enforced by the link target being a checkout the runner owns and
# the agent's writable set being specs/drafts/** alone. The agent has no shell,
# so it cannot chmod its way out.
worktree_links:
  reference/deadly-digital-platform: /home/ubuntu/deadly-digital-platform

# THE TREE, LISTED BY THE RUNNER, BEFORE THE AGENT WRITES A LINE.
#
# Three specs failed on paths and every failing one had a real sibling in the
# same directory: `routes/orders.py` beside a genuine
# `api/analytics/routes/orders.py`. That is recall, not knowledge, and asking
# the prompt to try harder puts the burden back on the thing that already
# failed three times. So the paths are put in front of it.
paths_pack:
  file: reference/PATHS.md
  base: reference/deadly-digital-platform
  roots:
    - api/analytics
    - platform/app/(dashboard)/analytics

# THE GATE, MADE REACHABLE DURING THE RUN, AND CAPPED.
#
# The check ran after the agent exited, so three fixes of seconds each went
# unmade and the tasks died terminally. self_check runs the contract's FIRST
# verification command -- the same command, not a copy -- so the preview
# cannot drift from the gate.
#
# self_check_max is 3: one to discover, one to confirm the fix, one spare for
# a second distinct problem. An agent that could run it without limit could
# mutate paths until green, which satisfies the check without establishing
# what the file is -- a worse outcome than the failure, because it passes.
# Every invocation is recorded on the PATCH_PROPOSED step.
self_check: true
self_check_max: 3

# Bash is absent from the default tool list on purpose (see runner.yaml), and
# this widens it by exactly ONE command with no argument wildcard. The script
# lives under contracts/**, which is protected, so the agent cannot edit the
# thing it is allowed to run; and the runner still runs the real verification
# after the agent exits, so this never becomes the gate.
agent_tools:
  - Read
  - Edit
  - Write
  - Grep
  - Glob
  - Bash(/home/ubuntu/fleet/contracts/checks/spec_selfcheck.sh)

verification:
  - /home/ubuntu/fleet/.venv/bin/python /home/ubuntu/fleet/contracts/checks/draft_spec_shape.py

# Smaller than research on every axis. A spec is shorter than an investigation,
# and this step is deliberately cheap because its whole purpose is to make the
# expensive step (a code task on a wrong path) not happen.
max_diff_lines: 400
# 2.50, measured 11 Sep 2026, was 2.00. Twelve draft specs have completed:
# mean £1.64, sd £0.29, max £1.97 -- 98% of the old ceiling. That is a
# distribution pressed against a wall, not one that fits under it, and task 66
# (run 36) was stopped by the cap having produced no branch and no diff.
# 2.50 is mean+3sd and 27% above the dearest spec that has ever finished, so a
# spec that reaches it is an outlier rather than an ordinary long one. This
# family is tight and well sampled, so it does not need the headroom code does.
max_cost_gbp: 2.50
timeout_seconds: 1800
