# The proving task's contract.
#
# Narrower than contracts/deadly-digital-platform.yaml on purpose: this task
# touches one file, so the writable set is the one directory that file is in.
# A proving run should fail if the agent wanders, and a wide writable set
# would let it wander without being noticed.
#
# The verification commands here are NOT the default contract's. `ruff check
# api/` reports 402 pre-existing errors on a clean checkout of main and
# `pytest api/tests/` needs a Postgres on 5433 that is not running, plus a
# 30% coverage gate the suite does not currently clear. Neither can pass, so
# neither can prove anything. These three can, and the third one FAILS on
# main and passes only on the intended change -- which is what makes this a
# proving task rather than a smoke test.
#
# The interpreter is an absolute path outside the worktree: api/.venv is
# gitignored, so it does not exist in a fresh worktree. The acceptance check
# is outside the worktree too, in the fleet repository, where the agent
# cannot write to it at all.

work_type: dd_docs
repo: deadly-digital-platform
base_branch: main
contract_version: 1

writable_paths:
  # api/analytics/routes/** would reach interventions.py, which 017
  # floored, so the routes are named individually.
  - api/analytics/routes/churn.py
  - api/analytics/routes/customers.py
  - api/analytics/routes/dashboard.py
  - api/analytics/routes/geography.py
  - api/analytics/routes/manifest.py
  - api/analytics/routes/orders.py
  - api/analytics/routes/products.py
  - api/analytics/routes/revenue.py
  - api/analytics/routes/segments.py
  - api/analytics/routes/setup.py
  - api/analytics/routes/sources.py
  - api/analytics/routes/sync.py

protected_paths:
  # the floor, which the database requires by name
  - api/tests/**
  - api/pytest.ini
  - api/ruff.toml
  - api/alembic/**
  - api/analytics/migrations/**
  - platform/__tests__/**
  - platform/vitest.config.ts
  - platform/playwright.config.ts
  # and the engine this route calls, which is not this task's business
  - api/analytics/services/**
  - api/app.py
  - .github/**

  # 017: the email floor. Fleet does not go near email; these are on
  # protected_path_floor, so a contract omitting one cannot create a task.
  - api/services/email_sender.py
  - api/worker.py
  - api/analytics/routes/interventions.py
  - api/analytics/services/trigger_router.py
  # 018: erasure. Reverting the commit does not bring the rows back.
  - api/analytics/services/gdpr.py
  # 019: the rest of the erasure path.
  - api/services/gdpr_identity.py
  - api/services/gdpr_replay_scrub.py
  # 023: the platform floor. Auth and session, billing, the frontend half of
  # the email platform, the storefront ingest, GDPR, and the intervention
  # surface inside the analytics tree. Listed verbatim because the database
  # refuses a contract that omits one -- not because this contract is about
  # any of them.
  - platform/middleware.ts
  - platform/lib/auth.ts
  - platform/lib/api-auth.ts
  - platform/lib/roles.ts
  - platform/lib/csrf.ts
  - platform/app/api/auth/**
  - platform/app/api/billing/**
  - platform/app/api/admin/billing/**
  - platform/app/(dashboard)/settings/billing/**
  - platform/app/api/campaigns/**
  - platform/app/api/flows/**
  - platform/app/api/domains/**
  - platform/app/api/suppression/**
  - platform/app/api/scheduled-campaigns/**
  - platform/app/api/inline-css/**
  - platform/app/api/listmonk/**
  - platform/app/(dashboard)/campaigns/**
  - platform/app/(dashboard)/flows/**
  - platform/app/(dashboard)/settings/domains/**
  - platform/app/api/track/**
  - platform/app/api/gdpr/**
  - platform/app/(dashboard)/settings/privacy/**
  - platform/app/api/analytics/churn/intervene/**
  - platform/app/api/analytics/interventions/**
  - platform/app/(dashboard)/analytics/interventions/**
verification:
  - /home/ubuntu/deadly-digital-platform/api/.venv/bin/python -m compileall -q api/analytics/routes/revenue.py
  - /home/ubuntu/deadly-digital-platform/api/.venv/bin/ruff check --select E9 api/analytics/routes/revenue.py
  - /home/ubuntu/deadly-digital-platform/api/.venv/bin/python /home/ubuntu/fleet/contracts/checks/revenue_granularity_doc.py

max_diff_lines: 30
max_cost_gbp: 1.00
timeout_seconds: 900
